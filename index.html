<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>
<title>별이 기억하는 겨울</title>

<style>
/*
  요청 비율 5 + 10 + 65 + 30 = 110이므로
  각 영역의 상대적인 크기를 유지해 110등분으로 배치합니다.

  상단 바       5fr
  챕터 제목    10fr
  중심 이미지 65fr
  대화창       30fr

  실제 적용 비율: 약 4.5% / 9.1% / 59.1% / 27.3%
*/
:root {
  --paper: #fffaf0;
  --green: #254e43;
  --mint: #dcecdf;
  --pink: #ed94b4;
  --gold: #e7bd68;
  --ink: #35483f;
  --muted: #718177;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  display: grid;
  place-items: center;
  overflow: hidden;
  background: #e5e9df;
  color: var(--ink);
  font-family:
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    "Malgun Gothic",
    sans-serif;
}

button {
  font: inherit;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible {
  outline: 3px solid #d58c40;
  outline-offset: 3px;
}

button:disabled {
  cursor: default;
  opacity: .45;
}

[hidden] {
  display: none !important;
}

/*
  스마트폰 안전 영역을 포함한 화면 높이 안에 게임을 맞춥니다.
  기본 비율은 가로:세로 = 1:1.65입니다.
  화면이 좁거나 짧으면 비율을 유지하며 축소합니다.
*/
.viewport {
  width: 100%;
  height: 100%;
  height: 100dvh;
  display: grid;
  place-items: center;

  padding:
    max(6px, env(safe-area-inset-top))
    max(6px, env(safe-area-inset-right))
    max(6px, env(safe-area-inset-bottom))
    max(6px, env(safe-area-inset-left));
}

.game {
  width: min(
    100%,
    480px,
    calc(
      (
        100dvh
        - max(6px, env(safe-area-inset-top))
        - max(6px, env(safe-area-inset-bottom))
      ) / 1.65
    )
  );

  aspect-ratio: 1 / 1.65;

  display: grid;
  grid-template-rows:
    minmax(0, 5fr)
    minmax(0, 10fr)
    minmax(0, 65fr)
    minmax(0, 30fr);

  position: relative;
  overflow: hidden;
  isolation: isolate;

  background: var(--paper);
  border-radius: 20px;
  box-shadow: 0 15px 70px #243c3220;

  container-type: inline-size;
}

.topbar {
  min-height: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 0 4%;
  border-bottom: 1px solid #e7e8da;
}

.brand {
  font-size: clamp(9px, 2.7cqw, 12px);
  letter-spacing: .09em;
  font-weight: 800;
}

.top-actions {
  display: flex;
  gap: 7px;
  align-items: center;
}

.counter {
  font-size: clamp(9px, 2.5cqw, 11px);
  color: var(--muted);
}

.icon-button {
  border: 0;
  background: transparent;
  color: var(--green);
  padding: 2px 4px;
  font-size: clamp(12px, 3.6cqw, 17px);
}

.chapter {
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 2% 5%;
}

.chapter small {
  font-size: clamp(9px, 2.5cqw, 11px);
  color: #a87942;
  letter-spacing: .1em;
}

.chapter h1 {
  margin: 2px 0 0;
  font-size: clamp(16px, 5cqw, 24px);
  line-height: 1.25;
  letter-spacing: -.045em;
}

.stage {
  position: relative;
  min-height: 0;
  overflow: hidden;
  margin: 0 3%;
  border-radius: 14px;
  background: #ecebdc;
}

.art {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}

.art.contain {
  object-fit: contain;
  background: #f0f0e4;
}

/* 이미지 주소를 넣기 전에도 화면 구성을 볼 수 있는 임시 배경 */
.placeholder {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  text-align: center;
  padding: 8%;
  background:
    radial-gradient(circle at 50% 30%, #fff9db, transparent 60%),
    linear-gradient(160deg, #e1eee0, #f6e6cf);
}

.placeholder .symbol {
  font-size: clamp(60px, 24cqw, 120px);
  line-height: 1.3;
  color: #cc9e48;
  text-shadow: 0 0 25px #fff8c8;
}

.placeholder p {
  margin: 8px 0 0;
  font-size: clamp(12px, 3.7cqw, 16px);
  font-weight: 700;
}

.scene-label {
  position: absolute;
  top: 3%;
  left: 4%;
  max-width: 90%;
  padding: 5px 10px;
  border-radius: 20px;
  color: #fff;
  background: #254e43d9;
  font-size: clamp(10px, 2.8cqw, 13px);
}

.direction-card {
  position: absolute;
  left: 5%;
  right: 5%;
  bottom: 5%;
  padding: 4%;
  border-radius: 12px;
  background: #fffdf2f2;
  box-shadow: 0 5px 20px #253d3020;
}

.direction-card strong {
  display: block;
  font-size: clamp(13px, 4cqw, 18px);
}

.direction-card p {
  margin: 5px 0 0;
  font-size: clamp(11px, 3.2cqw, 14px);
  line-height: 1.6;
  white-space: pre-line;
}

/*
  대사가 길어져도 다음 버튼이 밀려 화면 밖으로 나가지 않도록
  대사 영역과 버튼 영역을 나눕니다.
*/
.dialogue {
  min-height: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 5px;
  padding: 3% 5% 4%;
}

.speaker {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: clamp(11px, 3.4cqw, 15px);
  font-weight: 800;
}

.speaker-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--pink);
}

.dialogue-text {
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;

  font-size: clamp(12px, 3.8cqw, 17px);
  line-height: 1.65;
  white-space: pre-line;
  word-break: keep-all;
}

.dialogue-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.dialogue-progress {
  font-size: clamp(9px, 2.7cqw, 12px);
  color: var(--muted);
}

.primary,
.secondary {
  border: 0;
  border-radius: 9px;
  padding: 9px 15px;
  font-size: clamp(11px, 3.3cqw, 15px);
  font-weight: 700;
}

.primary {
  background: var(--green);
  color: white;
}

.secondary {
  background: #e8eddf;
  color: var(--green);
}

/* 인트로 */
.intro {
  position: absolute;
  inset: 0;
  z-index: 5;
  overflow: hidden;
  background: #173b34;
}

.intro .placeholder {
  background:
    radial-gradient(circle at 50% 28%, #fff7ce77, transparent 36%),
    linear-gradient(#23473f, #142f30);
}

.intro .placeholder p {
  display: none;
}

.intro::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    #102e2a15 30%,
    #102e2a45 55%,
    #102e2ae8
  );
  pointer-events: none;
}

.intro-copy {
  position: absolute;
  z-index: 1;
  left: 8%;
  right: 8%;
  bottom: 7%;
  text-align: center;
  color: white;
}

.intro-copy small {
  font-size: clamp(10px, 3cqw, 13px);
  letter-spacing: .12em;
}

.intro-copy h2 {
  margin: 12px 0;
  font-size: clamp(29px, 9cqw, 43px);
  line-height: 1.3;
  letter-spacing: -.06em;
}

.intro-copy p {
  font-size: clamp(12px, 3.5cqw, 16px);
  line-height: 1.7;
  color: #f4efdc;
}

.start {
  width: 100%;
  margin-top: 18px;
  padding: 14px;
  background: #f0d797;
  color: #284438;
}

/* 문제 1: 상자 열기 */
.puzzle {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6%;
  padding: 6%;
  background:
    radial-gradient(circle at top, #fff7d9, transparent 65%),
    #e7ecdf;
}

.clue {
  padding: 8px 14px;
  border: 1px dashed #b4a47c;
  border-radius: 9px;
  background: #fffdf2;
  font-size: clamp(12px, 3.8cqw, 17px);
  text-align: center;
}

.box-illustration {
  width: 45%;
  aspect-ratio: 1.4;
  position: relative;
  display: grid;
  place-items: center;
  background: #ad7552;
  border: 5px solid #81573c;
  border-radius: 8px;
  box-shadow: 0 10px 0 #79513822;
  font-size: clamp(28px, 11cqw, 50px);
  color: #ffe2a0;
}

.box-illustration::before {
  content: "";
  position: absolute;
  top: -9px;
  left: -10px;
  right: -10px;
  height: 16px;
  border: 3px solid #81573c;
  border-radius: 5px;
  background: #c18b62;
}

.lock {
  display: flex;
  gap: 10px;
}

.wheel-group {
  display: grid;
  justify-items: center;
  gap: 5px;
}

.wheel {
  width: clamp(50px, 17cqw, 78px);
  aspect-ratio: 1;
  border-radius: 50%;
  border: 6px double #baa05f;
  background: #fff7de;
  color: #365347;
  font-size: clamp(24px, 9cqw, 39px);
}

.wheel-arrow {
  border: 0;
  border-radius: 5px;
  padding: 2px 14px;
  background: #d7e2cf;
  color: #365347;
}

.puzzle-note {
  font-size: clamp(10px, 3cqw, 13px);
  text-align: center;
  color: var(--muted);
}

/* 問題2：서울 풍경 조각 */
.landscape {
  width: 100%;
  padding: 10px;
  background: #faf7e8;
  border: 1px solid #cdd7c4;
  border-radius: 12px;
}

.landscape-title {
  text-align: center;
  font-size: clamp(10px, 3cqw, 13px);
  margin-bottom: 10px;
  color: var(--muted);
}

.landscape-slots,
.landscape-pieces {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  width: 100%;
}

.landscape-slot {
  aspect-ratio: .85;
  border: 2px dashed #9cac91;
  border-radius: 8px;
  padding: 0;
  overflow: hidden;
  background: #e1e8da;
  color: #6b8167;
  font-size: 20px;
}

.landscape-pieces {
  margin-top: 10px;
}

.landscape-piece {
  border: 2px solid transparent;
  border-radius: 8px;
  padding: 0;
  aspect-ratio: .85;
  overflow: hidden;
  background: white;
}

.landscape-piece.selected {
  border-color: #d97c78;
  box-shadow: 0 0 0 3px #d97c7833;
}

.landscape-piece.used {
  opacity: .3;
}

.landscape-piece svg,
.landscape-slot svg {
  display: block;
  width: 100%;
  height: 100%;
}

@media (prefers-reduced-motion: no-preference) {
  .stage {
    animation: appear .25s ease;
  }

  @keyframes appear {
    from { opacity: .6; }
    to { opacity: 1; }
  }
}
</style>
</head>

<body>
<div class="viewport">
  <main class="game" aria-label="별이 기억하는 겨울 게임">

    <header class="topbar">
      <span class="brand">SEOUL GALLERY</span>

      <div class="top-actions">
        <span class="counter" id="pageCounter"></span>
        <button
          class="icon-button"
          id="homeButton"
          aria-label="처음 화면으로"
        >⌂</button>
      </div>
    </header>

    <section class="chapter">
      <small id="chapterLabel"></small>
      <h1 id="chapterTitle"></h1>
    </section>

    <section class="stage" id="stage"></section>

    <section class="dialogue" aria-label="캐릭터 대화">
      <div class="speaker">
        <span class="speaker-dot" id="speakerDot"></span>
        <span id="speakerName"></span>
      </div>

      <div
        class="dialogue-text"
        id="dialogueText"
        aria-live="polite"
      ></div>

      <div class="dialogue-actions">
        <span class="dialogue-progress" id="dialogueProgress"></span>
        <button class="primary" id="nextButton">다음</button>
      </div>
    </section>

    <section class="intro" id="intro">
      <div id="introArt" style="height:100%"></div>

      <div class="intro-copy">
        <small>해치와 소울프렌즈의 크리스마스 모험</small>
        <h2>별이 기억하는<br>겨울</h2>
        <p>잠들어 있던 작은 별에게<br>어떤 이야기가 기다리고 있을까요?</p>

        <button class="primary start" id="startButton">
          해치 만나러 가기
        </button>
      </div>
    </section>

  </main>
</div>

<script>
(() => {
  "use strict";

  /*
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    이미지 설정
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    },

        {

          who: "별",

    {

      puzzle: "seoul",
      label: "두 번째 문제",
      title: "흩어진 풍경을 이어 줘",

      lines: [
        {
          who: "해치",
          text:
            "별의 기억이 조각조각 흩어졌어.\n강이 끊기지 않도록 풍경을 이어 줄래?"
        }
      ]
    },

    {
      type: "story",
      label: "두 번째 기억",
      title: "작은 창문 너머로",
      image: "seoulScene",
      symbol: "⌂",

      lines: [
        {
          who: "별",
          text:
            "맞아, 이런 풍경이었어!\n나는 창문 안에서 한강을 바라봤어."
        },
        {
          who: "해치",
          text:
            "하나씩 기억나고 있네.\n그 창문이 있던 동네도 찾아볼까?"
        },
        {
          who: "백호",
          text:
            "좋아! 다음에는 서울책방으로 가 보자!"
        },
        {
          who: "안내",
          text:
            "여기까지가 현재 제작된 체험 구간입니다.\n다음에는 서울책방의 기억이 이어집니다."
        }
      ],

      nextLabel: "처음 화면으로",
      end: true
    }
  ];

  const $ = (selector) => document.querySelector(selector);

  const elements = {
    intro: $("#intro"),
    stage: $("#stage"),
    chapterLabel: $("#chapterLabel"),
    chapterTitle: $("#chapterTitle"),
    speakerName: $("#speakerName"),
    speakerDot: $("#speakerDot"),
    text: $("#dialogueText"),
    progress: $("#dialogueProgress"),
    next: $("#nextButton"),
    counter: $("#pageCounter")
  };

  let pageIndex = 0;
  let lineIndex = 0;
  let puzzleSolved = false;

  function escapeHTML(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");
  }

  function imageMarkup(key, fallbackTitle, symbol = "✦", contain = false) {
    const source = ASSETS[key];

    const fallback = `
      <div class="placeholder">
        <div class="symbol">${symbol}</div>
        <p>${escapeHTML(fallbackTitle)}</p>
      </div>
    `;

    if (!source) return fallback;

    return `
      ${fallback}
      <img
        class="art ${contain ? "contain" : ""}"
        src="${escapeHTML(source)}"
        alt="${escapeHTML(fallbackTitle)}"
        style="position:absolute;inset:0"
      >
    `;
  }

  function handleImageErrors(root) {
    root.querySelectorAll("img").forEach((image) => {
      image.addEventListener("error", () => {
        image.remove();
      }, { once: true });
    });
  }

  function currentPage() {
    return PAGES[pageIndex];
  }

  function showSpeech(who, text) {
    elements.speakerName.textContent = who;
    elements.speakerDot.style.background =
      CHARACTERS[who]?.color || "#86b9a5";

    elements.text.textContent = text;
    elements.text.scrollTop = 0;
  }

  function updateSpeech() {
    const page = currentPage();
    const line = page.lines[lineIndex];

    showSpeech(line.who, line.text);

    elements.progress.textContent =
      `${lineIndex + 1} / ${page.lines.length}`;

    const isLast = lineIndex === page.lines.length - 1;

    elements.next.textContent = isLast
      ? page.nextLabel || "다음 장소로"
      : "다음";
  }

  function setPage(index) {
    pageIndex = index;
    lineIndex = 0;
    puzzleSolved = false;

    const page = currentPage();

    elements.chapterLabel.textContent = page.label;
    elements.chapterTitle.textContent = page.title;
    elements.counter.textContent =
      `${pageIndex + 1} / ${PAGES.length}`;

    elements.next.disabled = false;

    if (page.type === "story") {
      renderStory(page);
      updateSpeech();
    }

    if (page.type === "guide") {
      renderGuide(page);
      updateSpeech();
    }

    if (page.type === "puzzle") {
      renderPuzzle(page);
    }

    handleImageErrors(elements.stage);
  }

  function renderStory(page) {
    elements.stage.innerHTML = imageMarkup(
      page.image,
      page.title,
      page.symbol
    );
  }

  function renderGuide(page) {
    const route = ROUTES[page.route];

    elements.stage.innerHTML = `
      ${imageMarkup(route.image, route.name, "➜", true)}

      <div class="scene-label">다음 장소를 찾아가세요</div>

      <div class="direction-card">
        <strong>📍 ${escapeHTML(route.name)}</strong>
        <p>${escapeHTML(route.detail)}</p>
      </div>
    `;
  }

  function renderPuzzle(page) {
    showSpeech(page.lines[0].who, page.lines[0].text);

    elements.progress.textContent = "문제를 풀어 주세요";
    elements.next.textContent = "정답 확인";

    if (page.puzzle === "box") {
      renderBoxPuzzle();
    }

    if (page.puzzle === "seoul") {
      renderSeoulPuzzle();
    }
  }

  function finishPuzzle(text) {
    puzzleSolved = true;

    showSpeech("해치", text);

    elements.progress.textContent = "✓ 미션 성공";
    elements.next.textContent = "이야기 이어 보기";
  }

  let checkPuzzle = () => {};

  /*
    첫 번째 문제: 기호 자물쇠
    실제 운영에서는 clueSymbols와 정답을 현장 표식에 맞게 교체하세요.
  */
  function renderBoxPuzzle() {
    const symbols = ["★", "☾", "❄", "●"];
    const answer = [0, 1, 2];
    const values = [3, 3, 3];

    elements.stage.innerHTML = `
      <div class="puzzle">
        <div class="clue">상자의 표식　★ → ☾ → ❄</div>

        <div class="box-illustration" id="boxSymbol">✦</div>

        <div class="lock">
          ${values.map((_, index) => `
            <div class="wheel-group">
              <button
                class="wheel-arrow"
                data-wheel="${index}"
                data-step="-1"
                aria-label="${index + 1}번째 원판 이전 기호"
              >↶</button>

              <button
                class="wheel"
                id="wheel${index}"
                data-wheel="${index}"
                data-step="1"
                aria-label="${index + 1}번째 원판 돌리기"
              >●</button>

              <button
                class="wheel-arrow"
                data-wheel="${index}"
                data-step="1"
                aria-label="${index + 1}번째 원판 다음 기호"
              >↷</button>
            </div>
          `).join("")}
        </div>

        <div class="puzzle-note">
          원판이나 화살표를 눌러 기호를 바꿔 보세요.
        </div>
      </div>
    `;

    elements.stage.querySelectorAll("[data-wheel]").forEach((button) => {
      button.addEventListener("click", () => {
        if (puzzleSolved) return;

        const index = Number(button.dataset.wheel);
        const step = Number(button.dataset.step);

        values[index] =
          (values[index] + step + symbols.length) % symbols.length;

        $("#wheel" + index).textContent = symbols[values[index]];
      });
    });

    checkPuzzle = () => {
      const correct = values.every(
        (value, index) => value === answer[index]
      );

      if (correct) {
        $("#boxSymbol").textContent = "★";

        finishPuzzle(
          "철컥! 상자가 열렸어.\n친구들이 기다리는 트리로 가져가자!"
        );
      } else {
        showSpeech(
          "해치",
          "어라, 아직 잠겨 있네.\n괜찮아! 위의 표식 순서와 다시 비교해 보자."
        );
      }
    };
  }

  /*
    두 번째 문제: 풍경 세 조각 연결
    좌우 강의 높이가 자연스럽게 이어지도록 배열합니다.
  */
  function landscapeSVG(piece) {
    const rivers = [
      "M-10 130 C25 130 45 90 110 90",
      "M-10 90 C35 90 60 140 110 140",
      "M-10 140 C40 140 65 105 110 105"
    ];

    const skylines = [
      `<rect x="12" y="49" width="18" height="45" fill="#83a396"/>
       <rect x="35" y="32" width="20" height="60" fill="#557b73"/>
       <rect x="62" y="56" width="15" height="37" fill="#b1be9b"/>`,

      `<path d="M50 12V70" stroke="#687b79" stroke-width="3"/>
       <path d="M42 32H58L54 43H46Z" fill="#b79472"/>
       <path d="M20 79Q50 50 85 81" fill="#8ead8f"/>`,

      `<rect x="12" y="50" width="18" height="48" fill="#90aaa0"/>
       <rect x="39" y="38" width="24" height="57" fill="#b9b38c"/>
       <rect x="73" y="61" width="17" height="37" fill="#648b80"/>`
    ];

    return `
      <svg
        viewBox="0 0 100 180"
        preserveAspectRatio="none"
        aria-hidden="true"
      >
        <rect width="100" height="180" fill="#f6e8bd"/>
        <circle cx="78" cy="22" r="11" fill="#fff6dc"/>
        ${skylines[piece]}
        <path
          d="${rivers[piece]}"
          stroke="#91c8d4"
          stroke-width="28"
          fill="none"
        />
        <path
          d="${rivers[piece]}"
          stroke="#e7f5ed"
          stroke-width="2"
          fill="none"
          stroke-dasharray="3 7"
        />
        <rect y="158" width="100" height="22" fill="#d6ddbd"/>
      </svg>
    `;
  }

  function renderSeoulPuzzle() {
    let selected = null;
    let placements = [null, null, null];

    const trayOrder = [2, 0, 1];

    elements.stage.innerHTML = `
      <div class="puzzle">
        <div class="clue">강이 끊기지 않게 이어 주세요</div>

        <div class="landscape">
          <div class="landscape-title">별이 바라보던 풍경</div>

          <div class="landscape-slots">
            ${[0, 1, 2].map((index) => `
              <button
                class="landscape-slot"
                data-slot="${index}"
                aria-label="${index + 1}번째 풍경 자리"
              >＋</button>
            `).join("")}
          </div>
        </div>

        <div class="landscape-pieces">
          ${trayOrder.map((piece) => `
            <button
              class="landscape-piece"
              data-piece="${piece}"
              aria-label="${piece + 1}번 풍경 조각 선택"
            >${landscapeSVG(piece)}</button>
          `).join("")}
        </div>

        <button class="secondary" id="clearLandscape">
          다시 놓기
        </button>

        <div class="puzzle-note">
          아래 조각을 선택한 뒤, 위쪽 빈자리를 눌러 주세요.
        </div>
      </div>
    `;

    function paint() {
      elements.stage.querySelectorAll("[data-slot]").forEach((slot) => {
        const index = Number(slot.dataset.slot);
        const piece = placements[index];

        slot.innerHTML = piece === null
          ? "＋"
          : landscapeSVG(piece);
      });

      elements.stage.querySelectorAll("[data-piece]").forEach((button) => {
        const piece = Number(button.dataset.piece);

        button.classList.toggle("selected", selected === piece);
        button.classList.toggle("used", placements.includes(piece));
      });
    }

    elements.stage.querySelectorAll("[data-piece]").forEach((button) => {
      button.addEventListener("click", () => {
        if (puzzleSolved) return;

        selected = Number(button.dataset.piece);
        paint();
      });
    });

    elements.stage.querySelectorAll("[data-slot]").forEach((slot) => {
      slot.addEventListener("click", () => {
        if (puzzleSolved) return;

        const index = Number(slot.dataset.slot);

        if (selected === null) {
          if (placements[index] !== null) {
            selected = placements[index];
            placements[index] = null;
          }
        } else {
          placements = placements.map(
            (piece) => piece === selected ? null : piece
          );

          placements[index] = selected;
          selected = null;
        }

        paint();
      });
    });

    $("#clearLandscape").addEventListener("click", () => {
      if (puzzleSolved) return;

      selected = null;
      placements = [null, null, null];
      paint();
    });

    checkPuzzle = () => {
      const correct = placements.every(
        (piece, index) => piece === index
      );

      if (correct) {
        finishPuzzle(
          "풍경이 하나로 이어졌어!\n별도 무언가 떠올린 것 같아."
        );
      } else {
        showSpeech(
          "해치",
          "강이 중간에서 끊기는 곳은 없을까?\n조각 양옆의 물길 높이를 살펴봐."
        );
      }
    };
  }

  function startGame() {
    elements.intro.hidden = true;
    setPage(0);
  }

  function returnToIntro() {
    elements.intro.hidden = false;
  }

  elements.next.addEventListener("click", () => {
    const page = currentPage();

    if (page.type === "puzzle") {
      if (!puzzleSolved) {
        checkPuzzle();
        return;
      }

      setPage(pageIndex + 1);
      return;
    }

    if (lineIndex < page.lines.length - 1) {
      lineIndex += 1;
      updateSpeech();
      return;
    }

    if (page.end) {
      returnToIntro();
      return;
    }

    setPage(pageIndex + 1);
  });

  $("#startButton").addEventListener("click", startGame);

  $("#homeButton").addEventListener("click", () => {
    if (confirm("처음 화면으로 돌아갈까요?")) {
      returnToIntro();
    }
  });

  $("#introArt").innerHTML = imageMarkup(
    "intro",
    "별이 기억하는 겨울",
    "✦"
  );

  handleImageErrors($("#introArt"));
  setPage(0);
})();
</script>
</body>
</html>
