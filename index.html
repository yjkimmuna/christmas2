<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>별이 기억하는 겨울</title>

<style>
/*
  파일 구성
  ├─ index.html
  ├─ image_01.png  장식 상자 찾기
  ├─ image_02.png  별 깨우기
  ├─ image_03.png  서울 전경
  ├─ image_04.png  서울책방
  ├─ image_05.png  공연장
  ├─ image_06.png  소망나무
  └─ image_07.png  별빛 엔딩

  대화 화면: 상단 / 제목 / 이미지 / 대화 = 5:10:65:30
  문제 화면: 하단 대화창 없이 문제 영역을 확장합니다.
*/

:root{
  --bg:#f4dce7;
  --paper:#fff5f9;
  --pink:#d46494;
  --pink-dark:#99476e;
  --pink-light:#f9dfe9;
  --ink:#674659;
  --muted:#a47f92;
  --line:#edd0de;
  --gold:#dfb35a;
}

*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%}
body{
  display:grid;
  place-items:center;
  overflow:hidden;
  background:var(--bg);
  color:var(--ink);
  font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
button,input,textarea{font:inherit}
button{
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
button:disabled{cursor:default;opacity:.45}
button:focus-visible,canvas:focus-visible{
  outline:3px solid #bd668c;
  outline-offset:3px;
}
[hidden]{display:none!important}

.viewport{
  width:100%;
  height:100%;
  height:100dvh;
  display:grid;
  place-items:center;
  padding:
    max(5px,env(safe-area-inset-top))
    max(5px,env(safe-area-inset-right))
    max(5px,env(safe-area-inset-bottom))
    max(5px,env(safe-area-inset-left));
}
.game{
  width:min(
    100%,
    480px,
    calc(
      (
        100dvh
        - max(5px,env(safe-area-inset-top))
        - max(5px,env(safe-area-inset-bottom))
      ) / 1.65
    )
  );
  aspect-ratio:1/1.65;
  display:grid;
  grid-template-rows:minmax(0,1fr) auto;
  position:relative;
  overflow:hidden;
  background:var(--paper);
  border-radius:20px;
  box-shadow:0 15px 60px #9a50732a;
  container-type:inline-size;
}
.screen{
  min-height:0;
  display:grid;
  grid-template-rows:
    minmax(0,5fr)
    minmax(0,10fr)
    minmax(0,65fr)
    minmax(0,30fr);
}
.screen.puzzle-mode{
  grid-template-rows:
    minmax(0,5fr)
    minmax(0,10fr)
    minmax(0,95fr);
}
.topbar{
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:0 4%;
  border-bottom:1px solid var(--line);
}
.brand{
  font-size:clamp(8px,2.6cqw,12px);
  font-weight:800;
  letter-spacing:.08em;
}
.top-right{display:flex;align-items:center;gap:8px}
.counter{
  font-size:clamp(9px,2.6cqw,12px);
  color:var(--muted);
}
.home{
  border:0;
  padding:0 4px;
  background:none;
  color:var(--pink-dark);
  font-size:18px;
}
.chapter{
  min-height:0;
  padding:1% 5%;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.chapter small{
  color:#b07793;
  font-size:clamp(8px,2.5cqw,11px);
  letter-spacing:.1em;
}
.chapter h1{
  margin:3px 0 0;
  font-size:clamp(15px,4.8cqw,23px);
  line-height:1.3;
  letter-spacing:-.045em;
}
.stage{
  min-height:0;
  position:relative;
  overflow:hidden;
  margin:0 3%;
  border-radius:13px;
  background:#f3dce6;
}
.puzzle-mode .stage{margin-bottom:3%}

.art{position:absolute;inset:0}
.art img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}
.fallback{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:8%;
  text-align:center;
  background:
    radial-gradient(circle at 50% 25%,#fff7e1,transparent 60%),
    linear-gradient(145deg,#f9dce8,#f0d5e2);
}
.fallback strong{
  color:#d4a657;
  font-size:clamp(60px,24cqw,115px);
}
.fallback span{
  font-size:clamp(12px,3.7cqw,17px);
  line-height:1.6;
}

.dialogue{
  min-height:0;
  display:grid;
  grid-template-columns:minmax(0,3fr) minmax(0,7fr);
  gap:8px;
  padding:3% 4%;
}
.portrait{
  min-height:0;
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
}
.portrait-image{
  min-height:0;
  width:100%;
  flex:1;
  position:relative;
  display:grid;
  place-items:center;
}
.portrait-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}
.portrait-image svg{width:94%;height:100%}
.portrait-name{
  font-size:clamp(10px,3.1cqw,14px);
  font-weight:800;
}
.message{
  min-height:0;
  min-width:0;
  display:grid;
  grid-template-rows:minmax(0,1fr) auto;
  gap:4px;
  padding:5%;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fffafd;
}
.message-text{
  min-height:0;
  overflow-y:auto;
  overscroll-behavior:contain;
  scrollbar-width:thin;
  font-size:clamp(11px,3.6cqw,17px);
  line-height:1.65;
  word-break:keep-all;
  white-space:pre-line;
}
.message-text.narration{
  color:#9a8590;
  font-style:italic;
}
.message-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:6px;
  min-height:28px;
}
.message-count{
  font-size:clamp(8px,2.4cqw,11px);
  color:var(--muted);
}
.primary,.secondary{
  border:0;
  border-radius:9px;
  padding:9px 13px;
  font-size:clamp(11px,3.2cqw,15px);
  font-weight:700;
}
.primary{background:var(--pink);color:white}
.secondary{background:#f3dce7;color:var(--pink-dark)}

.testbar{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  padding:4px 8px 6px;
  background:#f4deea;
  border-top:1px dashed #dfb7cc;
}
.testbar span{font-size:9px;color:#aa7b94}
.testbar button{
  border:1px solid #d5adc3;
  border-radius:5px;
  padding:3px 9px;
  background:#fff6fa;
  color:#9b5b7b;
  font-size:10px;
}

.overlay{
  position:absolute;
  inset:0;
  z-index:20;
  overflow:hidden;
  background:#a35c7d;
}
.overlay::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(
    transparent 20%,
    #71375320 45%,
    #713753ed
  );
}
.overlay-copy{
  position:absolute;
  z-index:1;
  left:8%;
  right:8%;
  bottom:7%;
  text-align:center;
  color:white;
}
.overlay-copy small{
  font-size:clamp(9px,2.8cqw,13px);
  letter-spacing:.1em;
}
.overlay-copy h2{
  margin:13px 0;
  font-size:clamp(28px,9cqw,43px);
  line-height:1.3;
  letter-spacing:-.06em;
}
.overlay-copy p{
  font-size:clamp(11px,3.5cqw,16px);
  line-height:1.8;
  white-space:pre-line;
}
.overlay-copy button{
  width:100%;
  margin-top:12px;
  padding:14px;
  background:#ffe0ed;
  color:#8a4165;
}

.guide-panel{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  padding:7%;
  background:
    radial-gradient(circle at top,#fff8ed,transparent 60%),
    linear-gradient(145deg,#f9e2ec,#eed2e1);
}
.guide-kicker{
  color:#bd779a;
  font-size:clamp(10px,3cqw,13px);
  letter-spacing:.12em;
}
.guide-destination{
  margin:0;
  text-align:center;
  font-size:clamp(21px,6.2cqw,29px);
  line-height:1.45;
}
.guide-arrow{
  width:70px;
  height:70px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#fff9fd;
  color:#c16d96;
  font-size:37px;
  box-shadow:0 5px 20px #c17f9a15;
}
.guide-note{
  padding:13px;
  width:100%;
  border:1px solid #dfb9cd;
  border-radius:12px;
  background:#fffbf5;
  font-size:clamp(11px,3.4cqw,15px);
  line-height:1.75;
  text-align:center;
  white-space:pre-line;
}
.guide-caption{
  position:absolute;
  bottom:4%;
  left:5%;
  right:5%;
  padding:12px;
  background:#fff6faf2;
  border-radius:10px;
  text-align:center;
  font-size:clamp(11px,3.4cqw,15px);
  line-height:1.6;
}

.puzzle{
  position:absolute;
  inset:0;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  gap:10px;
  padding:5%;
  background:
    radial-gradient(circle at top,#fff9eb,transparent 55%),
    linear-gradient(145deg,#f9e0eb,#efd6e4);
}
.puzzle-heading{
  padding:10px;
  background:#fff8fcee;
  border:1px solid #e4bfd2;
  border-radius:10px;
  text-align:center;
}
.puzzle-heading strong{
  display:block;
  font-size:clamp(13px,4cqw,18px);
  line-height:1.4;
}
.puzzle-heading p{
  margin:5px 0 0;
  font-size:clamp(10px,3cqw,14px);
  line-height:1.6;
  white-space:pre-line;
  color:#a1738c;
}
.puzzle-body{
  min-height:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
  overflow:auto;
}
.puzzle-footer{
  display:grid;
  justify-items:center;
  gap:6px;
}
.puzzle-status{
  margin:0;
  min-height:32px;
  text-align:center;
  font-size:clamp(11px,3.3cqw,15px);
  line-height:1.6;
  white-space:pre-line;
  color:#a4557a;
}
.puzzle-status.success{color:#8b5876;font-weight:700}
.puzzle-footer .primary{width:100%;padding:12px}
.puzzle-note{
  font-size:clamp(9px,2.8cqw,13px);
  color:#a17d91;
  text-align:center;
  line-height:1.6;
}
.rule{
  padding:9px 12px;
  border:1px dashed #d0a9bb;
  border-radius:9px;
  background:#fff9ef;
  text-align:center;
  font-size:clamp(12px,3.8cqw,18px);
}
.box{
  width:47%;
  aspect-ratio:1.5;
  display:grid;
  place-items:center;
  border:5px solid #bd829c;
  border-radius:7px;
  background:#e4b1c5;
  color:#fff6df;
  font-size:43px;
  box-shadow:0 8px 0 #c28da32a;
}
.wheels{display:flex;gap:10px}
.wheel{
  width:clamp(48px,18cqw,80px);
  aspect-ratio:1;
  border:6px double #d0a7bd;
  border-radius:50%;
  background:#fff4dc;
  color:#aa6b87;
  font-size:clamp(25px,9cqw,40px);
}
.slots,.pieces{
  width:100%;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.slot,.piece{
  padding:0;
  aspect-ratio:.85;
  border-radius:8px;
  overflow:hidden;
}
.slot{
  border:2px dashed #c59eb4;
  background:#ecd8e3;
  color:#b18a9e;
  font-size:28px;
}
.piece{border:3px solid transparent;background:#fff6ec}
.piece.selected{border-color:#d26d9a}
.piece.used{opacity:.3}
.slot svg,.piece svg{display:block;width:100%;height:100%}
.scratch-wrap{
  width:100%;
  height:clamp(150px,53cqw,230px);
  position:relative;
  overflow:hidden;
  border-radius:10px;
  background:#f6dfeb;
}
.scratch-picture{position:absolute;inset:0}
.scratch-picture img{width:100%;height:100%;object-fit:cover}
.cover{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  touch-action:none;
  cursor:crosshair;
}
.bar{
  width:85%;
  height:7px;
  overflow:hidden;
  background:#e2c2d3;
  border-radius:10px;
}
.bar i{
  display:block;
  width:0;
  height:100%;
  background:#d47da4;
}
.pads{
  width:85%;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.pad{
  aspect-ratio:1.35;
  border:3px solid #e4b6cd;
  border-radius:14px;
  background:#fff8ed;
  color:#c16b92;
  font-size:35px;
  box-shadow:0 5px 0 #dba6c0;
}
.pad.flash{
  background:#f9d49d;
  transform:translateY(4px);
  box-shadow:0 1px 0 #dba6c0;
}
.pairs{
  width:100%;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.pair-column{display:grid;gap:10px}
.pair-column small{
  text-align:center;
  color:#af7d96;
  font-size:11px;
}
.pair{
  min-height:65px;
  padding:8px;
  border:2px solid #e1b8cd;
  border-radius:10px;
  background:#fff6ee;
  color:#98617b;
  font-size:clamp(11px,3.4cqw,16px);
  line-height:1.55;
}
.pair.selected{border-color:#ce719a;background:#ffe2ee}
.pair.matched{border-color:#d49ab6;background:#efd4e3;opacity:.65}
.tiles{
  width:86%;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}
.tile{
  aspect-ratio:1;
  padding:0;
  border:2px solid #deb0c6;
  border-radius:9px;
  background:#fff8ed;
}
.tile svg{
  width:100%;
  height:100%;
  display:block;
  transition:transform .18s;
}
.tile.lit{background:#f5d999}
.hold-star{
  width:60%;
  aspect-ratio:1;
  border:0;
  background:none;
  color:#e2b85f;
  font-size:clamp(95px,39cqw,180px);
  line-height:1;
  user-select:none;
  touch-action:none;
  filter:drop-shadow(0 0 12px #eec78777);
  transform:scale(var(--scale,1));
}
.hold-star.glow{filter:drop-shadow(0 0 30px #efc45f);color:#f2c64d}
.wish-panel{
  position:absolute;
  inset:0;
  padding:8%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:15px;
  background:linear-gradient(#fce6ef,#eed8e6);
}
.wish-panel .star{font-size:65px;color:#ddae58}
.wish-input{
  width:100%;
  resize:none;
  padding:12px;
  border:1px solid #d6a9c0;
  border-radius:10px;
  background:#fffaf2;
  color:var(--ink);
  font-size:16px;
  line-height:1.65;
}
.wish-paper{
  max-width:100%;
  padding:23px;
  border-radius:8px;
  background:#fff4da;
  box-shadow:0 7px 20px #b8799820;
  white-space:pre-line;
  overflow-wrap:anywhere;
  text-align:center;
  font-size:clamp(13px,4cqw,19px);
}
@media(max-height:540px){
  .puzzle{gap:5px;padding:3%}
  .puzzle-body{gap:7px}
  .dialogue{padding:2% 4%}
  .testbar{padding:2px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

<body>
<div class="viewport">
<main class="game" aria-label="별이 기억하는 겨울">

  <div class="screen" id="screen">
    <header class="topbar">
      <span class="brand">SEOUL GALLERY</span>
      <div class="top-right">
        <span class="counter" id="counter"></span>
        <button class="home" id="home" aria-label="처음 화면으로">⌂</button>
      </div>
    </header>

    <section class="chapter">
      <small id="chapterLabel"></small>
      <h1 id="chapterTitle"></h1>
    </section>

    <section class="stage" id="stage"></section>

    <section class="dialogue" id="dialogue">
      <div class="portrait">
        <div class="portrait-image" id="portrait"></div>
        <div class="portrait-name" id="speaker"></div>
      </div>
      <div class="message">
        <div class="message-text" id="messageText"></div>
        <div class="message-actions">
          <span class="message-count" id="messageCount"></span>
          <button class="primary" id="next" hidden>다음</button>
        </div>
      </div>
    </section>
  </div>

  <div class="testbar" id="testbar">
    <span>TEST MODE</span>
    <button id="pass">문제 패스</button>
    <button id="retry">문제 다시</button>
  </div>

  <section class="overlay" id="overlay">
    <div id="overlayArt" style="position:absolute;inset:0"></div>
    <div class="overlay-copy">
      <small id="overlaySmall"></small>
      <h2 id="overlayTitle"></h2>
      <p id="overlayText"></p>
      <button class="primary" id="overlayButton"></button>
    </div>
  </section>

</main>
</div>

<script>
(() => {
"use strict";

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   설정
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const CONFIG={
  testMode:true,
  typingInterval:35,

  images:{
    intro:"image_01.png",
    box:"image_01.png",
    awake:"image_02.png",
    seoul:"image_03.png",
    book:"image_04.png",
    stage:"image_05.png",
    wish:"image_06.png",
    ending:"image_07.png",
    outro:"image_07.png"
  },

  /*
    캐릭터 단독 이미지를 준비하면 아래 주소를 넣으세요.
    예: "해치":"haechi.png"
    비어 있으면 이름이 들어간 임시 프로필을 표시합니다.
  */
  portraits:{
    "해치":"",
    "백호":"",
    "청룡":"",
    "주작":"",
    "현무":"",
    "별":"",
    "아이의 기억":"",
    "안내":""
  },

  /*
    7장의 키비주얼은 길 안내 지도가 아니므로
    별도 길 안내 이미지는 선택 사항으로 분리했습니다.
    image가 비어 있으면 목적지와 안내 문구를 표시합니다.
    실제 동선은 현장 확인 후 detail에 입력하세요.
  */
  routes:{
    box:{
      name:"장식 상자를 둔 곳",
      image:"",
      detail:"현장 안내 표식을 따라\n장식 상자가 놓인 곳으로 이동해 주세요."
    },
    seoul:{
      name:"내친구서울 1관",
      image:"",
      detail:"서울도시모형이 보이는 곳으로\n이동해 주세요."
    },
    book:{
      name:"서울책방",
      image:"",
      detail:"서울책방 입구의\n미션 표식을 찾아 주세요."
    },
    stage:{
      name:"공연장",
      image:"",
      detail:"공연장 주변의 미션 표식을 찾아 주세요.\n무대에 올라가지 않아도 참여할 수 있어요."
    },
    wish:{
      name:"소망나무",
      image:"",
      detail:"소망 메모가 걸려 있는\n나무를 찾아 주세요."
    },
    christmas:{

function esc(v){
  return String(v).replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function later(fn,ms){
  const id=setTimeout(fn,ms);
  cleanups.push(()=>clearTimeout(id));
  return id;
}

function cleanup(){
  token++;
  clearInterval(typingTimer);
  typing=false;
  cleanups.forEach(fn=>fn());
  cleanups=[];
  puzzleCheck=null;
}

function imageHTML(source,title,symbol="✦"){
  return `<div class="art">
    <div class="fallback">
      <strong>${symbol}</strong>
      <span>${esc(title)}</span>
    </div>
    ${source?`<img src="${esc(source)}" alt="${esc(title)}">`:""}
  </div>`;
}

function sceneImage(key,title,symbol="✦"){
  return imageHTML(CONFIG.images[key],title,symbol);
}

function watchImages(root){
  root.querySelectorAll("img").forEach(img=>{
    img.addEventListener("error",()=>img.remove(),{once:true});
  });
}

  }

  const colors={

      fill="#8c5b76" font-family="sans-serif">${esc(name)}</text>

function say(who,text,buttonLabel){
  clearInterval(typingTimer);
  typing=true;
  ui.next.hidden=true;
  ui.text.textContent="";
  ui.text.classList.toggle("narration",who==="지문");
  ui.speaker.textContent=who==="지문"?"":who;
  ui.portrait.innerHTML=portraitHTML(who);
  watchImages(ui.portrait);

  const chars=Array.from(text);
  const currentToken=token;
  let i=0;

  const finish=()=>{
    clearInterval(typingTimer);
    typing=false;
    ui.next.textContent=buttonLabel;
    ui.next.hidden=false;
  };

  if(!chars.length){finish();return}

  typingTimer=setInterval(()=>{
    if(currentToken!==token){
      clearInterval(typingTimer);
      return;
    }
    ui.text.textContent+=chars[i++];
    ui.text.scrollTop=ui.text.scrollHeight;
    if(i>=chars.length)finish();
  },Math.max(1,CONFIG.typingInterval));
}

function current(){return CHAPTERS[chapter]}

function setLayout(isPuzzle){
  ui.screen.classList.toggle("puzzle-mode",isPuzzle);
  ui.dialogue.hidden=isPuzzle;
  $("#testbar").hidden=!CONFIG.testMode;
  ui.pass.disabled=!isPuzzle||solved;
  ui.retry.disabled=!isPuzzle;
}

function updateHeader(){
  const labels={
    before:"이야기",
    guide:"장소 안내",
    puzzle:"문제",
    after:"되찾은 기억",
    epilogue:"에필로그"
  };
  ui.label.textContent=phase==="epilogue"?"EPILOGUE":
    `CHAPTER ${String(chapter+1).padStart(2,"0")} · ${labels[phase]}`;
  ui.title.textContent=phase==="epilogue"?"별에게 들려주는 이야기":current().title;
  ui.counter.textContent=phase==="epilogue"?"완주":`${chapter+1} / 7`;
}

function renderLines(){
  const lines=current()[phase];
  const item=lines[lineIndex];
  const last=lineIndex===lines.length-1;
  let nextLabel="다음";

  if(last){
    if(phase==="before")nextLabel=chapter===6?"함께 응원하기":"다음 장소 확인";
    if(phase==="guide")nextLabel=chapter===6?"마지막 문제 시작":"도착했어요";
    if(phase==="after")nextLabel=chapter===6?"별의 이야기 마무리":"이야기 이어 보기";
  }

  ui.count.textContent=`${lineIndex+1} / ${lines.length}`;
  say(item.who,item.text,nextLabel);
}

function renderGuide(){
  const route=CONFIG.routes[current().route];
  const stay=chapter===6;

  if(route.image){
    ui.stage.innerHTML=imageHTML(route.image,route.name,"➜")+
      `<div class="guide-caption">${esc(stay?"현재 장소":route.name)}<br>
      ${esc(stay?"이동 없이 이 자리에서 진행해 주세요.":route.detail).replaceAll("\n","<br>")}</div>`;
  }else{
    ui.stage.innerHTML=`<div class="guide-panel">
      <div class="guide-kicker">${stay?"현재 장소":"다음 장소"}</div>
      <div class="guide-arrow">${stay?"★":"➜"}</div>
      <h2 class="guide-destination">${esc(route.name).replaceAll("\n","<br>")}</h2>
      <div class="guide-note">${esc(stay?
        "이동하지 않고,\n지금 있는 자리에서 진행해 주세요.":route.detail)}</div>
    </div>`;
  }
}

function enter(nextPhase){
  cleanup();
  phase=nextPhase;
  lineIndex=0;
  solved=false;
  ui.next.hidden=true;

  setLayout(phase==="puzzle");
  updateHeader();

  if(phase==="puzzle"){
    PUZZLES[current().puzzle]();
  }else if(phase==="guide"){
    renderGuide();
    renderLines();
  }else if(phase==="epilogue"){
    renderEpilogue();
  }else{
    ui.stage.innerHTML=sceneImage(current().image,current().title);
    renderLines();
  }

  watchImages(ui.stage);
}

ui.next.onclick=()=>{
  if(typing)return;
  if(phase==="epilogue"){advanceEpilogue();return}

  const lines=current()[phase];

  if(lineIndex<lines.length-1){
    lineIndex++;
    renderLines();
    return;
  }

  if(phase==="before"){enter("guide");return}
  if(phase==="guide"){enter("puzzle");return}

  if(phase==="after"){
    if(chapter===6){enter("epilogue");return}
    chapter++;
    enter("before");
  }
};

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   문제 공통: 대화창 없이 설명 / 조작 / 결과 표시
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function puzzleFrame(title,instruction,body,checkLabel="정답 확인"){
  ui.stage.innerHTML=`
    <div class="puzzle">
      <div class="puzzle-heading">
        <strong>${esc(title)}</strong>
        <p>${esc(instruction)}</p>
      </div>
      <div class="puzzle-body">${body}</div>
      <div class="puzzle-footer">
        <p class="puzzle-status" id="puzzleStatus" role="status" aria-live="polite"></p>
        <button class="primary" id="check" ${checkLabel?"":"hidden"}>
          ${esc(checkLabel)}
        </button>
      </div>
    </div>`;

  $("#check").onclick=()=>{
    if(solved){enter("after");return}
    if(puzzleCheck)puzzleCheck();
  };
}

function status(text,success=false){
  const el=$("#puzzleStatus");
  if(!el)return;
  el.textContent=text;
  el.classList.toggle("success",success);
}

function solve(){
  if(solved||phase!=="puzzle")return;
  solved=true;
  ui.pass.disabled=true;

  const messages=[
    "상자가 열렸어요!",
    "서울의 풍경이 이어졌어요!",
    "가려진 기억을 찾아냈어요!",
    "기억 속 가락이 돌아왔어요!",
    "서로 닮은 소망을 찾았어요!",
    "별빛이 끝까지 이어졌어요!",
    "별빛이 가득 모였어요!"
  ];

  status("✓ "+messages[chapter],true);
  const button=$("#check");
  button.hidden=false;
  button.disabled=false;
  button.textContent="이야기 이어 보기";

  ui.stage.querySelectorAll(
    ".wheel,.piece,.slot,.pad,.pair,.tile,#listen,#scratchAssist,#holdAssist,#holdStar"
  ).forEach(b=>b.disabled=true);
}

ui.pass.onclick=()=>{
  if(phase==="puzzle"&&!solved)solve();
};
ui.retry.onclick=()=>{
  if(phase==="puzzle")enter("puzzle");
};

/* ━━━━━━━━━━━ 1. 상자 자물쇠 ━━━━━━━━━━━ */
function boxPuzzle(){
  const symbols=["★","☾","❄","●"];
  const answer=[0,1,2];

  puzzleFrame(

/* ━━━━━━━━━━━ 2. 서울 풍경 조각 ━━━━━━━━━━━ */
function landscapePuzzle() {
  let selected = null;
  let slots = [null, null, null];

  puzzleFrame(
    "별이 바라보던 풍경을 이어 주세요",
    "강이 끊기지 않게 조각을 놓으세요.",

    `
      <div class="slots">
        ${[0, 1, 2].map(i => `
          <button
            class="slot"
            data-slot="${i}"
            aria-label="${i + 1}번째 자리"
          >＋</button>
        `).join("")}
      </div>

      <div class="pieces">
        ${[2, 0, 1].map(i => `
          <button
            class="piece"
            data-piece="${i}"
            aria-label="${i + 1}번 조각 선택"
          >
            ${landscapeSVG(i)}
          </button>
        `).join("")}
      </div>

      <div class="puzzle-note">
        아래 조각 선택 → 위쪽 자리 선택<br>
        놓인 조각을 누르면 다시 집을 수 있어요.
      </div>
    `
  );

  function paint() {
    ui.stage.querySelectorAll("[data-slot]").forEach(button => {
      const piece = slots[Number(button.dataset.slot)];

      button.innerHTML = piece === null
        ? "＋"
        : landscapeSVG(piece);
    });

    ui.stage.querySelectorAll("[data-piece]").forEach(button => {
      const piece = Number(button.dataset.piece);

      button.classList.toggle("selected", selected === piece);
      button.classList.toggle("used", slots.includes(piece));
    });
  }

  ui.stage.querySelectorAll("[data-piece]").forEach(button => {
    button.onclick = () => {
      if (solved) return;

      selected = Number(button.dataset.piece);
      paint();
    };
  });

  ui.stage.querySelectorAll("[data-slot]").forEach(button => {
    button.onclick = () => {
      if (solved) return;

      const index = Number(button.dataset.slot);

      if (selected === null) {
        selected = slots[index];
        slots[index] = null;
      } else {
        slots = slots.map(piece =>
          piece === selected ? null : piece
        );

        slots[index] = selected;
        selected = null;
      }

      paint();
    };
  });

  puzzleCheck = () => {
    if (slots.every((piece, index) => piece === index)) {
      solve();
    } else {
      status("조각 양옆의 강 높이를 비교해 보세요.");
    }
  };
}

/* ━━━━━━━━━━━ 3. 스크래치 ━━━━━━━━━━━ */
function scratchPuzzle(){
  let dragging=false,last=null,pct=0,row=18;

  puzzleFrame(
    "가려진 기억을 찾아 주세요",
    "화면을 문질러 그림을 60% 이상 드러내세요.",
    `<div class="scratch-wrap">
      <div class="scratch-picture">
        ${sceneImage("book","책 속에 떠오른 아이의 방","★")}
      </div>
      <canvas class="cover" id="scratch" width="440" height="240"
        tabindex="0" aria-label="손가락이나 마우스로 문질러 그림을 드러내세요"></canvas>
    </div>
    <div class="bar"><i id="scratchBar"></i></div>
    <div class="puzzle-note" id="scratchPercent">0% 발견</div>
    <button class="secondary" id="scratchAssist">한 줄 걷어내기</button>`
  );

  const canvas=$("#scratch");
  const ctx=canvas.getContext("2d",{willReadFrequently:true});

  if(!ctx){
    status("그림을 불러오지 못했습니다. 문제 다시 또는 테스트 패스를 이용해 주세요.");
    return;
  }

  const gradient=ctx.createLinearGradient(0,0,440,240);
  gradient.addColorStop(0,"#d7b8cd");
  gradient.addColorStop(1,"#bca0b7");
  ctx.fillStyle=gradient;
  ctx.fillRect(0,0,440,240);
  ctx.fillStyle="#8c647c";
  ctx.font="bold 18px sans-serif";
  ctx.textAlign="center";
  ctx.fillText("살살 문질러 기억을 찾아주세요",220,125);
  ctx.globalCompositeOperation="destination-out";
  ctx.lineWidth=43;
  ctx.lineCap="round";

  const erase=(a,b)=>{
    ctx.beginPath();
    ctx.moveTo(a[0],a[1]);
    ctx.lineTo(b[0],b[1]);
    ctx.stroke();
  };

  const update=()=>{
    const pixels=ctx.getImageData(0,0,440,240).data;
    let total=0,clear=0;
    for(let i=3;i<pixels.length;i+=64){
      total++;
      if(pixels[i]<100)clear++;
    }
    pct=Math.round(clear/total*100);
    $("#scratchBar").style.width=pct+"%";
    $("#scratchPercent").textContent=pct+"% 발견";
  };

  const point=e=>{
    const r=canvas.getBoundingClientRect();
    return[
      (e.clientX-r.left)*440/r.width,
      (e.clientY-r.top)*240/r.height
    ];
  };

  canvas.onpointerdown=e=>{
    if(solved)return;
    dragging=true;
    canvas.setPointerCapture(e.pointerId);
    last=point(e);
    erase(last,[last[0]+.1,last[1]]);
  };

  canvas.onpointermove=e=>{
    if(!dragging||solved)return;
    const p=point(e);
    erase(last,p);
    last=p;
  };

  canvas.onpointerup=canvas.onpointercancel=()=>{
    dragging=false;
    update();
  };

  $("#scratchAssist").onclick=()=>{
    if(solved)return;
    erase([0,row],[440,row]);
    row+=34;
    update();
  };

  puzzleCheck=()=>{
    update();
    if(pct>=60){
      canvas.hidden=true;
      solve();
    }else status("아직 가려진 부분을 조금 더 문질러 보세요.");
  };
}

/* ━━━━━━━━━━━ 4. 소리 가락 ━━━━━━━━━━━ */
async function ensureAudio(){
  const Audio=window.AudioContext||window.webkitAudioContext;
  if(!Audio)throw Error("unsupported");
  if(!audioContext)audioContext=new Audio();

  let timeout;
  try{
    await Promise.race([
      audioContext.resume(),
      new Promise((resolve,reject)=>{
        timeout=setTimeout(()=>reject(Error("timeout")),1500);
      })
    ]);
  }finally{
    clearTimeout(timeout);
  }
}

function tone(n,delay=0){
  if(!audioContext||audioContext.state!=="running")return;

  const oscillator=audioContext.createOscillator();
  const gain=audioContext.createGain();
  const time=audioContext.currentTime+delay;

  oscillator.frequency.value=[262,330,392,523][n];
  gain.gain.setValueAtTime(0,time);
  gain.gain.linearRampToValueAtTime(.1,time+.02);
  gain.gain.exponentialRampToValueAtTime(.001,time+.3);
  oscillator.connect(gain);
  gain.connect(audioContext.destination);
  oscillator.start(time);
  oscillator.stop(time+.33);

  oscillator.onended=()=>{
    oscillator.disconnect();
    gain.disconnect();
  };

  cleanups.push(()=>{
    try{oscillator.stop()}catch(error){}
  });
}

function soundPuzzle(){
  const pattern=[0,2,1,3];
  let input=[],busy=false,heard=false,visualOn=true;

  puzzleFrame(
    "기억 속 가락을 따라 해주세요",
    "가락을 들은 뒤 같은 순서로 소리판을 누르세요.",
    `<div class="pads">${["●","▲","■","✦"].map((symbol,i)=>
      `<button class="pad" data-pad="${i}" aria-label="${["도","미","솔","높은 도"][i]} 소리판" disabled>${symbol}</button>`
    ).join("")}</div>
    <button class="secondary" id="listen">가락 듣기</button>
    <button class="secondary" id="visualAudio">빛으로도 보기: 켜짐</button>
    <div class="puzzle-note" id="audioState">가락 듣기를 눌러 시작하세요.</div>`,
    ""
  );

  const flash=n=>{
    const b=ui.stage.querySelector(`[data-pad="${n}"]`);
    if(!b)return;
    b.classList.add("flash");
    later(()=>b.classList.remove("flash"),280);
  };

  $("#visualAudio").onclick=()=>{
    visualOn=!visualOn;
    $("#visualAudio").textContent="빛으로도 보기: "+(visualOn?"켜짐":"꺼짐");
  };

  $("#listen").onclick=async()=>{
    if(busy||solved)return;
    const currentToken=token;
    busy=true;
    input=[];
    heard=false;
    $("#listen").disabled=true;
    ui.stage.querySelectorAll("[data-pad]").forEach(b=>b.disabled=true);

    let audioFailed=false;
    try{await ensureAudio()}catch(error){audioFailed=true}

    if(currentToken!==token)return;

    if(audioFailed){
      visualOn=true;
      status("소리 대신 빛의 순서로도 풀 수 있어요.");
    }

    $("#visualAudio").textContent="빛으로도 보기: "+(visualOn?"켜짐":"꺼짐");
    $("#audioState").textContent="가락을 듣는 중이에요.";

    pattern.forEach((n,i)=>{
      tone(n,.1+i*.65);
      if(visualOn)later(()=>flash(n),100+i*650);
    });

    later(()=>{
      busy=false;
      heard=true;
      $("#listen").disabled=false;
      ui.stage.querySelectorAll("[data-pad]").forEach(b=>b.disabled=false);
      $("#audioState").textContent="같은 순서로 눌러 주세요.";
    },2900);
  };

  ui.stage.querySelectorAll("[data-pad]").forEach(b=>b.onclick=()=>{
    if(busy||!heard||solved)return;
    const n=+b.dataset.pad;
    tone(n);
    flash(n);

    if(n!==pattern[input.length]){
      input=[];
      $("#audioState").textContent="처음 음부터 다시 해보세요.";
      return;
    }

    input.push(n);
    $("#audioState").textContent=input.length+" / 4";

    if(input.length===pattern.length){
      heard=false;
      solve();
    }
  });
}

/* ━━━━━━━━━━━ 5. 소망 연결 ━━━━━━━━━━━ */
function pairsPuzzle(){
  let selected=null;
  const matched=new Set();

  const old=[
    {id:0,text:"엄마 감기가\n빨리 나았으면!"},
    {id:1,text:"친구랑\n화해하고 싶어!"},
    {id:2,text:"내일은\n잘하고 싶어!"}
  ];

  const now=[
    {id:2,text:"새로운 일을\n잘 시작하고 싶어요"},
    {id:0,text:"우리 가족이\n건강했으면 좋겠어요"},
    {id:1,text:"소중한 사람과\n사이좋게 지내고 싶어요"}
  ];

  puzzleFrame(
    "서로 닮은 소망을 찾아 주세요",
    "왼쪽 기억과 비슷한 마음을 오른쪽에서 고르세요.",
    `<div class="pairs">
      <div class="pair-column">
        <small>별이 기억하는 말</small>
        ${old.map(v=>`<button class="pair" data-old="${v.id}">${esc(v.text).replaceAll("\n","<br>")}</button>`).join("")}
      </div>
      <div class="pair-column">
        <small>지금 사람들의 소망</small>
        ${now.map(v=>`<button class="pair" data-now="${v.id}">${esc(v.text).replaceAll("\n","<br>")}</button>`).join("")}
      </div>
    </div>
    <div class="puzzle-note" id="pairCount">0 / 3 마음 연결</div>`,
    ""
  );

  function paint(){
    ui.stage.querySelectorAll("[data-old],[data-now]").forEach(b=>{
      const id=Number(b.dataset.old??b.dataset.now);
      b.classList.toggle("matched",matched.has(id));
      b.classList.toggle("selected",b.dataset.old!==undefined&&selected===id);
      b.disabled=matched.has(id);
    });
  }

  ui.stage.querySelectorAll("[data-old]").forEach(b=>b.onclick=()=>{
    if(solved)return;
    selected=+b.dataset.old;
    paint();
    status("");
  });

  ui.stage.querySelectorAll("[data-now]").forEach(b=>b.onclick=()=>{
    if(solved)return;

    if(selected===null){
      status("왼쪽 기억부터 골라 주세요.");
      return;
    }

    if(selected===+b.dataset.now){
      matched.add(selected);
      selected=null;
      paint();
      $("#pairCount").textContent=matched.size+" / 3 마음 연결";
      status("");
      if(matched.size===3)solve();
    }else status("두 이야기에서 바라는 것이 무엇인지 살펴보세요.");
  });
}

/* ━━━━━━━━━━━ 6. 별빛 연결 ━━━━━━━━━━━ */
function circuitPuzzle(){
  const base=[
    [3,1],[3,1],[3,2],
    [1,2],[3,1],[0,3],
    [0,1],[3,1],[3,1]
  ];
  const rotations=[1,0,2,2,1,1,3,1,0];

  puzzleFrame(
    "별빛이 지나갈 길을 이어 주세요",
    "왼쪽 위에서 출발해 모든 칸을 지나\n오른쪽 아래 출구까지 연결하세요.",
    `<div class="puzzle-note">입구 →</div>
    <div class="tiles">${base.map((ends,i)=>
      `<button class="tile" data-tile="${i}" aria-label="${i+1}번 길 회전">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          ${ends.map(d=>
            `<path d="M50 50L${[50,100,50,0][d]} ${[0,50,100,50][d]}" stroke="#cc9b65" stroke-width="13" fill="none"/>`
          ).join("")}
          <circle cx="50" cy="50" r="8" fill="#cc9b65"/>
        </svg>
      </button>`
    ).join("")}</div>
    <div class="puzzle-note">조각을 누르면 90° 회전합니다.　→ 출구</div>`,
    "별빛 보내기"
  );

  const paint=()=>{
    ui.stage.querySelectorAll("[data-tile]").forEach((b,i)=>{
      b.querySelector("svg").style.transform=`rotate(${rotations[i]*90}deg)`;
      b.classList.remove("lit");
    });
  };

  paint();

  ui.stage.querySelectorAll("[data-tile]").forEach(b=>b.onclick=()=>{
    if(solved)return;
    const i=+b.dataset.tile;
    rotations[i]=(rotations[i]+1)%4;
    paint();
  });

  puzzleCheck=()=>{
    const dirs=base.map((arr,i)=>arr.map(d=>(d+rotations[i])%4));
    let position=0,entry=3;
    const seen=new Set();

    while(true){
      if(seen.has(position)||!dirs[position].includes(entry))break;
      seen.add(position);
      const exit=dirs[position].find(d=>d!==entry);

      if(position===8&&exit===1){
        if(seen.size===9){
          ui.stage.querySelectorAll(".tile").forEach(b=>b.classList.add("lit"));
          solve();
          return;
        }
        break;
      }

      const x=position%3+[0,1,0,-1][exit];
      const y=Math.floor(position/3)+[-1,0,1,0][exit];

      if(x<0||x>2||y<0||y>2)break;

      position=y*3+x;
      entry=(exit+2)%4;
    }

    ui.stage.querySelectorAll(".tile").forEach((b,i)=>{
      b.classList.toggle("lit",seen.has(i));
    });

    status("밝아진 칸 다음에서 길이 끊겼어요.\n다음 조각의 방향을 확인해 보세요.");
  };
}

/* ━━━━━━━━━━━ 7. 별빛 모으기 ━━━━━━━━━━━ */
function holdPuzzle(){
  let progress=0,holding=false,last=0,raf=0;

  puzzleFrame(
    "별에게 따뜻한 빛을 모아 주세요",
    "별을 꾹 누르고 있으면 빛이 모입니다.",
    `<button class="hold-star" id="holdStar" aria-label="누르고 있으면 별빛이 모입니다">★</button>
    <div class="bar"><i id="holdBar"></i></div>
    <div class="puzzle-note" id="holdState">빛 0%</div>
    <button class="secondary" id="holdAssist">한 번 눌러 힘 보태기</button>`,
    ""
  );

  const star=$("#holdStar");

  function paint(){
    $("#holdBar").style.width=progress+"%";
    $("#holdState").textContent="빛 "+Math.round(progress)+"%";
    star.style.setProperty("--scale",String(1+progress/700));
    star.classList.toggle("glow",progress>35);
  }

  function stop(){
    holding=false;
    cancelAnimationFrame(raf);
  }

  function finish(){
    stop();
    progress=100;
    paint();
    solve();
  }

  function tick(now){
    if(!holding||solved)return;
    progress=Math.min(100,progress+(now-last)/40);
    last=now;
    paint();

    if(progress>=100){finish();return}
    raf=requestAnimationFrame(tick);
  }

  function start(){
    if(holding||solved)return;
    holding=true;
    last=performance.now();
    raf=requestAnimationFrame(tick);
  }

  star.onpointerdown=e=>{
    star.setPointerCapture(e.pointerId);
    start();
  };
  star.onpointerup=star.onpointercancel=stop;
  star.onkeydown=e=>{
    if(e.code==="Space"||e.code==="Enter"){
      e.preventDefault();
      start();
    }
  };
  star.onkeyup=e=>{
    if(e.code==="Space"||e.code==="Enter"){
      e.preventDefault();
      stop();
    }
  };
  star.onblur=stop;

  $("#holdAssist").onclick=()=>{
    if(solved)return;
    progress=Math.min(100,progress+20);
    paint();
    if(progress>=100)finish();
  };

  cleanups.push(stop);
}

const PUZZLES={
  box:boxPuzzle,
  landscape:landscapePuzzle,
  scratch:scratchPuzzle,
  sound:soundPuzzle,
  pairs:pairsPuzzle,
  circuit:circuitPuzzle,
  hold:holdPuzzle
};

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   에필로그
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function renderEpilogue(){
  epilogueIndex=0;
  wishStep=0;
  ui.stage.innerHTML=sceneImage("ending","서울의 밤하늘에 떠오른 별");
  showEpilogueLine();
}

function showEpilogueLine(){
  const item=EPILOGUE[epilogueIndex];
  ui.count.textContent=`${epilogueIndex+1} / ${EPILOGUE.length}`;
  say(
    item.who,
    item.text,
    epilogueIndex===EPILOGUE.length-1?"내 소망 남기기":"다음"
  );
}

function advanceEpilogue(){
  if(wishStep===0){
    if(epilogueIndex<EPILOGUE.length-1){
      epilogueIndex++;
      showEpilogueLine();
      return;
    }

    wishStep=1;
    ui.stage.innerHTML=`
      <div class="wish-panel">
        <div class="star">✦</div>
        <textarea
          class="wish-input"
          id="wishInput"
          maxlength="120"
          rows="3"
          aria-label="별에게 남길 소망"
          placeholder="나의 작은 소망은……"
        ></textarea>
        <div class="puzzle-note">
          120자까지 적을 수 있어요.<br>
          작성한 내용은 서버로 전송되지 않습니다.
        </div>
      </div>`;
    ui.count.textContent="나의 소망";
    say(
      "해치",
      "별에게 어떤 이야기를 들려주고 싶어?\n글을 남기지 않고 넘어가도 괜찮아.",
      "별에게 전하기"
    );
    return;
  }

  if(wishStep===1){
    const value=$("#wishInput").value.trim();

    ui.stage.innerHTML=`
      <div class="wish-panel">
        <div class="star">✦</div>
        <div class="wish-paper">${
          value?esc(value):"말하지 않은 마음도\n함께 간직할게."
        }</div>
        <div class="puzzle-note">별에게 소망을 전했어요.</div>
      </div>`;

    wishStep=2;
    say(
      "별",
      "들려줘서 고마워.\n너의 내일도 응원하고 있을게.",
      "모험 마치기"
    );
    return;
  }

  outro();
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   인트로 / 아웃트로
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function showOverlay(image,title,small,text,button,action){
  cleanup();
  ui.overlay.hidden=false;
  $("#overlayArt").innerHTML=sceneImage(image,title);
  $("#overlaySmall").textContent=small;
  $("#overlayTitle").textContent=title;
  $("#overlayText").textContent=text;
  $("#overlayButton").textContent=button;
  $("#overlayButton").onclick=action;
  watchImages($("#overlayArt"));
}

function intro(){
  showOverlay(
    "intro",
    "별이 기억하는 겨울",
    "해치와 소울프렌즈의 크리스마스 모험",
    "잠들어 있던 작은 별에게\n어떤 이야기가 기다리고 있을까요?",
    "해치 만나러 가기",
    ()=>{
      chapter=0;
      ui.overlay.hidden=true;
      enter("before");
    }
  );
}

function outro(){
  showOverlay(
    "outro",
    "모험 완료!",
    "함께해 줘서 고마워요",
    "작은 별의 이야기를 함께 찾아냈어요.\n\n이 화면을 안내데스크에 보여주고\n준비된 선물을 받아 가세요.",
    "처음 화면으로",
    intro
  );
}

$("#home").onclick=()=>{
  if(confirm("처음 화면으로 돌아갈까요?\n진행 중인 문제는 초기화됩니다.")){
    intro();
  }
};

$("#testbar").hidden=!CONFIG.testMode;
ui.pass.disabled=true;
ui.retry.disabled=true;

intro();

})();
