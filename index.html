<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>도착하지 않은 크리스마스 · 서울갤러리</title>
<style>
:root{--ink:#243e36;--green:#234e40;--paper:#faf6ec;--red:#b4483d;--line:#ded8c7;--gold:#b18342}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family: 'Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.7}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:4px}button:disabled{cursor:default;opacity:.45}header{padding:18px 5vw;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:15px}header strong{font-size:13px;letter-spacing:.13em}header span{font-size:11px;color:#68766c}.layout{max-width:1140px;margin:42px auto;padding:0 28px;display:grid;grid-template-columns:280px 1fr;gap:55px}aside{padding-top:15px}.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--red);font-weight:bold}h1{font-family:Georgia,'Batang',serif;font-weight:500;font-size:39px;line-height:1.35;letter-spacing:-.05em;margin:14px 0 20px}h2{font-size:25px;line-height:1.5;letter-spacing:-.04em;margin:10px 0}p{margin:12px 0}.muted{color:#737c72;font-size:13px}.route{padding:0;list-style:none;margin:25px 0}.route button{background:none;border:0;color:inherit;text-align:left;width:100%;padding:10px 0;font-size:13px}.route button:disabled{opacity:.6}.dot{display:inline-flex;border:1px solid #b8c2b4;border-radius:50%;width:25px;height:25px;align-items:center;justify-content:center;margin-right:10px;font-size:11px}.active .dot,.done .dot{background:var(--green);color:white}.bag{border-top:1px solid var(--line);padding-top:17px}.stamps{display:flex;gap:7px;margin-top:10px}.stamp{border:1px dashed var(--gold);padding:5px 10px;color:var(--gold);font-size:12px;background:#fffbf1}.stamp.empty{opacity:.4}.card{position:relative;background:#fffdf7;border:1px solid var(--line);box-shadow:0 14px 55px #31453308;border-radius:6px;padding:30px 34px;min-height:570px}.card:before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:repeating-linear-gradient(120deg,#b64a40 0 18px,#faf6ec 18px 36px,#34594c 36px 54px,#faf6ec 54px 72px);border-radius:6px 6px 0 0}.topline{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#7b8075}.tag{border:1px solid var(--line);border-radius:20px;padding:2px 10px}.speech{border-left:3px solid #b2bda7;padding:6px 15px;background:#f0f2e9;margin:20px 0;font-size:14px}.speech b{display:block;font-size:11px;color:#687f61;margin-bottom:4px}.primary,.secondary{border:0;border-radius:4px;padding:12px 20px;font-size:14px}.primary{background:var(--green);color:#fff}.secondary{background:#edece3;color:var(--ink)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:23px}.scene{background:#efeee4;border:1px solid #e1dfd0;border-radius:5px;padding:18px;margin:20px 0}.scene summary{cursor:pointer;font-size:13px;font-weight:bold}.note{font-size:12px;color:#7f7561}.status{font-size:14px;min-height:26px;margin-top:14px;color:var(--red)}.status.ok{color:var(--green)}.envelope{width:250px;max-width:90%;height:155px;margin:35px auto;background:#e9dfc9;position:relative;box-shadow:0 10px 16px #4d433516;border:1px solid #cabd9f;display:flex;align-items:flex-end;justify-content:center;padding-bottom:14px;font-family:Georgia,'Batang',serif}.envelope:before{content:'';position:absolute;top:0;left:0;border-left:124px solid transparent;border-right:124px solid transparent;border-top:85px solid #d6c7a9;max-width:100%}.seal{position:absolute;z-index:1;top:55px;left:calc(50% - 22px);border-radius:50%;width:44px;height:44px;background:var(--red);color:#f8e9cd;display:grid;place-items:center;font-size:22px}.choices{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.choice{padding:12px 17px;border:1px solid #c8cfbe;background:white;border-radius:4px;color:var(--ink)}.choice.selected{background:var(--green);color:white}.slots{min-height:58px;border:1px dashed #a8b49e;padding:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}.map{position:relative;padding:18px;background:#e8ede1;border-radius:5px;display:grid;grid-template-columns:repeat(3,1fr);gap:13px;max-width:420px;margin:16px auto}.map:before{content:'';position:absolute;left:0;right:0;top:48%;height:20px;transform:rotate(-14deg);background:#bed7d9}.map button{position:relative;min-height:65px;border:1px solid #b5c2ad;background:#fffdf4;border-radius:5px;color:var(--ink)}.map button.selected{background:var(--green);color:white}.lensboard{position:relative;border-radius:4px;height:185px;background:#d7c8b3;overflow:hidden;display:flex;align-items:center;justify-content:center;margin-top:15px}.cipher{font-family:Georgia,'Batang',serif;font-size:23px;letter-spacing:.12em;filter:blur(7px);opacity:.38}.lens{position:absolute;inset:0;clip-path:circle(57px at var(--x,50%) 50%);display:flex;align-items:center;justify-content:center;background:#fcf9ed;font-family:Georgia,'Batang',serif;font-size:23px;letter-spacing:.12em}.range{width:100%;accent-color:var(--green);margin-top:18px}.answer{padding:11px;border:1px solid #b9c4af;width:100%;max-width:300px;border-radius:4px;background:#fff;font-size:16px}.overlaybox{height:170px;position:relative;background:#eee9da;border:1px solid #d5ceba;overflow:hidden;margin:18px 0}.layer{position:absolute;inset:15px 0;display:flex;align-items:center;justify-content:center;font:36px Georgia,'Batang',serif;letter-spacing:10px;color:var(--green);transition:transform .1s}.layer:nth-child(2){color:var(--red)}.letter{padding:25px;background:#f6efdd;border:1px solid #ddcfb2;font-family:'Batang',Georgia,serif;line-height:2.1;animation:reveal .7s ease}.tree{font-size:65px;text-align:center;margin:20px 0;color:var(--green);line-height:1.1}.snow{pointer-events:none;position:fixed;inset:0;overflow:hidden;z-index:4}.snow i{position:absolute;top:-30px;animation:fall 6s linear infinite;color:#b58a47;font-style:normal}.footer{max-width:1140px;margin:20px auto 35px;padding:0 28px;display:flex;justify-content:space-between;gap:15px;font-size:11px;color:#778171}.textbtn{background:none;border:0;text-decoration:underline;color:#637364;font-size:12px;padding:5px}.help{background:#f5edda;padding:12px;font-size:13px;margin-top:12px}@keyframes reveal{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}@keyframes fall{to{transform:translateY(110vh) rotate(180deg)}}@media(max-width:780px){header{padding:14px 20px}.layout{grid-template-columns:1fr;gap:20px;margin:20px auto;padding:0 18px}aside{padding:0}h1{font-size:29px;margin:8px 0}aside>p{display:none}.route{display:flex;margin:12px 0;gap:4px}.route li{flex:1}.route button{text-align:center;font-size:10px;padding:3px 0}.dot{display:flex;margin:0 auto 3px}.bag{padding-top:8px;display:flex;gap:15px;align-items:center}.stamps{margin:0}.card{padding:25px 20px;min-height:510px}h2{font-size:23px}.footer{padding:0 20px}.layer{font-size:27px;letter-spacing:5px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><header><strong>SEOUL GALLERY <span>× CHRISTMAS POST</span></strong><span>인터랙티브 체험 시안</span></header>
<div class="layout"><aside><div class="eyebrow">A LETTER WAITING FOR YOU</div><h1>도착하지 않은<br>크리스마스</h1><p class="muted">해치와 소울프렌즈의<br>마지막 편지 배달 작전</p><ol class="route" id="route"></ol><div class="bag"><span class="muted">배달 가방</span><div class="stamps" id="bag"></div></div><p class="note">현장 이동 없이 모든 미션을 체험할 수 있어요.<br>각 문제의 ‘현장 단서 보기’를 열어주세요.</p></aside><main class="card" id="app"></main></div><footer class="footer"><span>서울갤러리 · 크리스마스 미션 / 비공식 기획 시안</span><button class="textbtn" id="reset">처음부터 다시</button></footer><div id="snow" class="snow" aria-hidden="true"></div>
<script>
// 현장 적용 시 SCENES의 단서·대사·정답을 교체합니다. 서버·외부 파일 없이 실행됩니다.
const KEY='seoul-christmas-mail-v1';
const SCENES=[
{place:'크리스마스 우체국',title:'받는 사람이 사라졌어요',who:'해치',say:'분명 오늘 배달해야 하는 편지인데… 이름도 주소도 없어! 나랑 편지의 주인을 찾아주지 않을래?'},
{place:'내친구서울 2관',title:'편지가 지나온 길',who:'청룡',say:'도장을 따라가면 되는 거지? 그런데 순서가 뒤죽박죽이야!'},
{place:'내친구서울 1관',title:'서울에 도착한 편지',who:'백호',say:'여기까지 왔으면 직접 찾아보자! 지도에 남은 메모대로 길을 이어봐.'},
{place:'서울책방',title:'글자 사이에 숨은 답장',who:'주작',say:'이건 빈 종이가 아니야. 가방에 있던 해독 렌즈부터 꺼내봐!'},
{place:'소망나무',title:'서로 다른 소망, 하나의 편지',who:'현무',say:'편지가 여러 사람을 가리켰던 이유… 여기에서 알 것 같아. 도장을 겹쳐볼까?'},
{place:'크리스마스 트리',title:'마지막 수신인',who:'해치',say:'우리, 드디어 편지 주인을 찾은 것 같아. 처음의 봉투를 다시 열어보자!'}];
let state={unlocked:0,finished:false};try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Number.isInteger(s.unlocked)&&s.unlocked>=0&&s.unlocked<=5)state={unlocked:s.unlocked,finished:s.finished===true&&s.unlocked===5}}catch(e){}
let page=state.unlocked,order=[],path=[],lensOn=false,offset=90;
const $=s=>document.querySelector(s);const app=$('#app');
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function msg(t,ok=false){$('#status').textContent=t;$('#status').className='status'+(ok?' ok':'')}
function shell(body){const s=SCENES[page];app.innerHTML=`<div class="topline"><span>CHRISTMAS POST / ${String(page).padStart(2,'0')}</span><span class="tag">${s.place}</span></div><h2>${s.title}</h2><div class="speech"><b>${s.who}의 메시지</b>${s.say}</div>${body}<div id="status" class="status" role="status" aria-live="polite"></div>`;nav()}
function clue(t){return `<details class="scene"><summary>현장 단서 보기 · 시안용</summary><p>${t}</p><span class="note">실제 운영에서는 이 정보를 현장 전시·안내물에서 찾게 됩니다.</span></details>`}
function controls(hint){return `<div class="actions"><button class="primary" id="check">확인하기</button><button class="secondary" id="hint">힌트</button></div><div id="help" hidden class="help">${hint}</div>`}
function bindHint(){$('#hint').onclick=()=>{$('#help').hidden=!$('#help').hidden}}
function nav(){$('#route').innerHTML=SCENES.map((s,i)=>`<li class="${i===page?'active':i<state.unlocked?'done':''}"><button data-page="${i}" ${i>state.unlocked?'disabled':''}><span class="dot">${i<state.unlocked?'✓':i+1}</span>${['시작','세계','서울','책방','소망','배달'][i]}</button></li>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=+b.dataset.page;render()});$('#bag').innerHTML=['별','달','눈'].map((s,i)=>`<span class="stamp ${state.unlocked>i+1?'':'empty'}">${state.unlocked>i+1?s:'·'}</span>`).join('')+(state.unlocked>=3?'<span class="stamp">렌즈</span>':'')}
function complete(text){state.unlocked=Math.max(state.unlocked,page+1);save();nav();msg(text,true);$('#check').disabled=true;const b=document.createElement('button');b.className='primary';b.textContent='다음 장소로 →';b.onclick=()=>{page++;render();app.scrollIntoView({behavior:'smooth',block:'start'})};app.appendChild(b)}
function render(){order=[];path=[];lensOn=false;offset=90;$('#snow').innerHTML='';
if(page===0){shell(`<p>서울갤러리에 도착한 편지 한 통.<br>봉투에는 이상한 우편 도장 세 개만 남아 있습니다.</p><div class="envelope"><div class="seal">✦</div>TO. 알 수 없는 수신인</div><p class="muted">4개의 장소에서 단서를 찾고, 마지막 편지를 배달하세요.<br>가방의 도장과 도구는 뒤의 문제에서 다시 쓰입니다.</p><button class="primary" id="start">임시 배달대원 되기 →</button>`);$('#start').onclick=()=>{state.unlocked=Math.max(1,state.unlocked);save();page=1;render()}}
if(page===1){shell(`<p>우편 도장을 <b>먼저 찍힌 순서대로</b> 선택하세요.</p>${clue('우편 기록: “별 다음에는 달이 떴고, 마지막에는 눈이 내렸다.”')}<div class="slots" id="slots">아래 도장을 차례로 눌러주세요.</div><div class="choices">${['눈','별','달'].map(s=>`<button class="choice" data-stamp="${s}">${s==='별'?'✦':s==='달'?'☾':'❄'} ${s}</button>`).join('')}</div><button class="textbtn" id="clear">순서 지우기</button>${controls('문장의 등장 순서를 읽어보세요. 별 → 달 → 눈입니다.')}`);document.querySelectorAll('[data-stamp]').forEach(b=>b.onclick=()=>{order.push(b.dataset.stamp);b.disabled=true;$('#slots').textContent=order.join(' → ')});$('#clear').onclick=()=>render();$('#check').onclick=()=>order.join(',')==='별,달,눈'?complete('우편 기록 복원 완료! 별 도장을 가방에 넣었어요.'):msg('도장의 순서가 기록과 달라요. 단서를 다시 살펴보세요.');bindHint()}
if(page===2){shell(`<p>출발점부터 도착점까지 <b>세 장소</b>를 차례로 눌러 배달 경로를 이으세요.</p>${clue('배달 메모: “책방에서 출발해 바로 동쪽 광장으로. 그곳에서 남쪽의 나무로.” 지도 위쪽이 북쪽입니다.')}<div class="map">${['우체국','정원','다리','책방','광장','전망대','카페','나무','극장'].map(s=>`<button data-node="${s}">${s}</button>`).join('')}</div><div id="trail" class="slots">경로를 선택하세요.</div><button class="textbtn" id="clear">경로 지우기</button>${controls('책방 → 광장 → 나무. 한강 모양의 선은 이번 예시에서는 배경입니다.')}`);document.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{if(path.length>=3)return;path.push(b.dataset.node);b.classList.add('selected');b.disabled=true;$('#trail').textContent=path.join(' → ')});$('#clear').onclick=()=>render();$('#check').onclick=()=>path.join(',')==='책방,광장,나무'?complete('경로 연결 완료! 달 도장과 해독 렌즈를 얻었어요.'):msg('메모의 방향과 출발점을 확인해 주세요.');bindHint()}
if(page===3){shell(`<p>가방의 렌즈로 흐릿한 편지를 살펴보세요.</p>${clue('책방의 안내: “보이지 않는 문장은 빛을 모아 읽으세요. 마지막 두 글자가 다음 장소의 열쇠입니다.”')}<button class="secondary" id="tool">가방에서 해독 렌즈 꺼내기</button><div class="lensboard"><span class="cipher">소망이 모이는 나무</span><div class="lens" id="lens" hidden>소망이 모이는 나무</div></div><label class="muted" for="slide">렌즈 움직이기</label><input id="slide" class="range" type="range" min="0" max="100" value="50" disabled><input class="answer" id="answer" placeholder="찾아낸 두 글자를 입력하세요" aria-label="편지의 마지막 두 글자" autocomplete="off">${controls('렌즈를 오른쪽으로 옮기면 마지막 단어 ‘나무’가 보입니다.')}`);$('#lens').style.display='none';$('#tool').onclick=()=>{lensOn=true;$('#lens').style.display='flex';$('#slide').disabled=false;$('#tool').textContent='해독 렌즈 사용 중';$('#tool').disabled=true};$('#slide').oninput=e=>$('#lens').style.setProperty('--x',e.target.value+'%');$('#check').onclick=()=>!lensOn?msg('먼저 가방에서 해독 렌즈를 꺼내주세요.'):$('#answer').value.replace(/\s/g,'')==='나무'?complete('문장 해독 완료! 눈 도장을 얻었어요. 편지는 소망나무를 가리키고 있어요.'):msg('렌즈를 움직여 문장의 마지막 두 글자를 찾아주세요.');bindHint()}
if(page===4){shell(`<p>가방에 모인 세 도장의 글자 조각을 <b>한 줄로 겹치세요.</b></p>${clue('나무에 걸린 고정 카드: “나를 위한 소망도, 너를 위한 소망도. 답장을 받는 사람은 우리 ○○.”')}<div class="stamps"><span class="stamp">✦ 별 도장</span><span class="stamp">☾ 달 도장</span><span class="stamp">❄ 눈 도장</span></div><div class="overlaybox"><div class="layer" style="clip-path:inset(0 0 65% 0)">우리 모두에게</div><div class="layer" id="layer2" style="clip-path:inset(35% 0 30% 0)">우리 모두에게</div><div class="layer" id="layer3" style="clip-path:inset(70% 0 0 0)">우리 모두에게</div></div><label for="align" class="muted">슬라이더로 도장 정렬하기</label><input class="range" id="align" type="range" min="-100" max="100" value="90"><input class="answer" id="answer" placeholder="카드의 빈칸 두 글자" aria-label="답장을 받는 사람">${controls('슬라이더를 가운데로 옮기면 ‘우리 모두에게’가 완성됩니다. 빈칸은 ‘모두’입니다.')}`);const align=()=>{$('#layer2').style.transform=`translateX(${offset}px)`;$('#layer3').style.transform=`translateX(${-offset}px)`};align();$('#align').oninput=e=>{offset=+e.target.value;align()};$('#check').onclick=()=>Math.abs(offset)>7?msg('글자 조각이 아직 어긋나 있어요. 도장을 한 줄로 맞춰주세요.'):$('#answer').value.replace(/\s/g,'')!=='모두'?msg('완성된 문장과 현장 카드의 빈칸을 함께 확인해 주세요.'):complete('수신인 확인! 이 편지는 한 사람이 아닌, 우리 모두에게 보내는 답장이었어요.');bindHint()}
if(page===5){shell(`<p>소망이 모여 만든 편지에는 한 사람의 이름을 적을 수 없었습니다. 그래서 우리의 도움이 필요했던 거예요.</p><div class="envelope"><div class="seal">✦</div>TO. 우리 모두에게</div><button class="primary" id="open">마지막 편지 열기</button><div id="ending"></div>`);$('#open').onclick=finish;if(state.finished)finish()}}
function finish(){state.finished=true;save();$('#open').hidden=true;$('#ending').innerHTML='<div class="letter"><div class="eyebrow">DELIVERY COMPLETE</div><p>가족의 건강을 바랐던 당신에게,<br>새로운 시작을 준비하는 당신에게,<br>누군가와 함께이고 싶었던 당신에게.</p><p>당신이 남겨 준 마음은<br>이곳에 잘 도착했습니다.</p><p><b>누군가의 소망을 배달하러 온 당신에게도,<br>따뜻한 크리스마스가 도착했습니다.</b></p><p>— 해치와 소울프렌즈</p></div><div class="tree">✧<br>♧</div><p style="text-align:center" class="muted">마지막 배달 완료 · 임시 배달대원 미션 성공</p>';
$('#snow').innerHTML=Array.from({length:22},(_,i)=>`<i style="left:${i*4.7}%;animation-delay:${-i*.6}s;animation-duration:${5+i%4}s">${i%2?'·':'✦'}</i>`).join('')}
$('#reset').onclick=()=>{if(confirm('모은 단서와 진행 기록을 지우고 처음부터 시작할까요?')){state={unlocked:0,finished:false};page=0;save();render()}};render();
</script></body></html>
