<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff1f5">
<title>해치 크리스마스 — 오래된 별의 자리</title>

<style>
:root{
  --pink:#f472b6;
  --deep:#c92570;
  --soft:#fff1f5;
  --red:#ef4444;
  --green:#268652;
  --dark:#17643d;
  --ink:#573747;
  --cream:#fffaf0;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:#fff1f5;
  color:var(--ink);
  font-family:"DungGeunMo","Courier New",monospace,sans-serif;
  display:flex;
  justify-content:center;
}
button,input,select{font:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{
  outline:3px solid #0284c7;
  outline-offset:3px;
}
[hidden]{display:none!important}

#app{
  width:min(100%,460px);
  height:100vh;
  height:min(100dvh,820px);
  position:relative;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:var(--soft);
  box-shadow:0 0 35px #9d174d18;
}
.topbar{
  flex:none;
  min-height:43px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  padding:6px 9px;
  background:#fff9;
  border-bottom:2px solid #fff;
  z-index:5;
}
.progress{
  padding:5px 9px;
  background:var(--green);
  color:white;
  border:2px solid var(--dark);
  border-radius:15px;
  box-shadow:0 2px #17643d;
  font-size:11px;
  font-weight:bold;
  white-space:nowrap;
}
.tools{display:flex;gap:4px}
.tool{
  background:white;
  color:var(--deep);
  border:2px solid #f9a8d4;
  border-radius:12px;
  padding:5px 6px;
  font-size:10px;
  font-weight:bold;
}
#screen{
  flex:1;
  min-height:0;
  position:relative;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.debug{
  flex:none;
  display:flex;
  gap:5px;
  align-items:center;
  background:#fef9c3;
  padding:5px 8px;
  border-top:1px dashed #ca8a04;
}
.debug label,.debug button,.debug select{font-size:10px}
.debug select{flex:1;min-width:0;padding:4px}
.debug button{
  background:white;
  border:1px solid #ca8a04;
  border-radius:4px;
  padding:5px;
}

/* 인트로: 이미지 위에 타이틀과 투명 버튼만 배치 */
.intro{
  position:absolute;
  inset:0;
  overflow:hidden;
  background:#ffe7ec;
}
.intro-plane{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}
.intro-image{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}
.intro-title{
  position:absolute;
  margin:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  line-height:1.23;
  color:white;
  font-weight:900;
  letter-spacing:-1px;
  text-shadow:
    2px 2px 0 #b91c66,
    -1px -1px 0 #b91c66,
    0 3px 0 #85184d;
  pointer-events:none;
}
.intro-title small{display:block;font-size:.52em;margin-top:.16em}
.intro-start{
  position:absolute;
  background:transparent;
  border:0;
  padding:0;
  color:transparent;
  appearance:none;
}
.intro-fallback{
  position:absolute;
  inset:0;
  background:linear-gradient(#ffe4e6,#fff7ed);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:20px;
  color:#9d174d;
}
.intro-fallback .big{font-size:100px}
.intro-fallback-start{
  position:absolute;
  display:flex;
  justify-content:center;
  align-items:center;
  border:3px solid #9d174d;
  border-radius:18px;
  background:#ef4444;
  color:white;
  font-weight:bold;
  pointer-events:none;
}

/* 장면 공통 */
.world{
  position:absolute;
  inset:0;
  overflow:hidden;
  isolation:isolate;
}
.world::before{
  content:"";
  position:absolute;
  inset:0;
  background-image:
    radial-gradient(#fff9 1.5px,transparent 1.5px);
  background-size:22px 22px;
  opacity:.45;
  pointer-events:none;
}
.world.warehouse{background:linear-gradient(#ffd5df 0 59%,#fff0d5 59%)}
.world.tree{background:linear-gradient(#ffe4ed,#fff5d8)}
.world.city{background:linear-gradient(#d9edff,#fff0f4)}
.world.books{background:linear-gradient(#f9d6e6,#fff3da)}
.world.stage{background:linear-gradient(#fecdd3,#fff0de)}
.world.wishes{background:linear-gradient(#d7f2e8,#fff3e2)}
.world.finale{background:linear-gradient(#f6d4ea,#fff4d2)}

.ribbon{
  position:absolute;
  z-index:10;
  top:12px;
  left:8%;
  width:84%;
  margin:0;
  padding:10px 12px;
  background:var(--green);
  border:3px solid white;
  outline:2px solid var(--dark);
  border-radius:16px 7px 16px 7px;
  box-shadow:0 5px #17643d33;
  color:white;
  text-align:center;
  font-size:15px;
  line-height:1.4;
  transform:rotate(-1deg);
}
.ribbon::before,.ribbon::after{
  content:"✦";
  color:#fde68a;
  margin:0 5px;
}
.story-art{
  flex:1;
  min-height:0;
  position:relative;
  overflow:hidden;
}
.story-art>img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:2;
}
.fallback-scene{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:55px 18px 18px;
  text-align:center;
  gap:15px;
  background:radial-gradient(ellipse at center,#fff9,transparent);
}
.fallback-scene .large{font-size:100px;filter:drop-shadow(0 5px 0 #fff)}
.fallback-scene strong{
  background:white;
  border:2px solid #f9a8d4;
  border-radius:15px;
  padding:8px 15px;
  font-size:13px;
}
.fallback-scene small{font-size:11px}
.story-page{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  position:relative;
  background:#ffe4ed;
}
.route-strip{
  flex:none;
  padding:9px 12px;
  font-size:12px;
  line-height:1.7;
  background:#fffc;
  border-top:3px solid white;
}
.route-strip strong{color:var(--deep)}
.dialogue{
  flex:none;
  display:grid;
  grid-template-columns:3fr 7fr;
  min-height:157px;
  height:clamp(157px,26dvh,195px);
  background:#fff6fa;
  border-top:4px solid white;
  box-shadow:0 -3px 0 #e879ac;
  z-index:5;
}
.avatar{
  position:relative;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(#fce7f3,#fff5f7);
}
.avatar>span{font-size:45px}
.avatar img{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:contain;
}
.chat{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:5px;
  padding:10px 12px 9px 7px;
}
.sender{
  font-size:12px;
  font-weight:bold;
  color:var(--deep);
}
.message{
  flex:1;
  min-height:0;
  overflow-y:auto;
  white-space:pre-wrap;
  word-break:keep-all;
  font-size:13px;
  line-height:1.65;
}
.message.narration{color:#64748b;font-style:italic}
.next{
  align-self:flex-end;
  padding:6px 10px;
  min-height:32px;
  background:#fce7f3;
  color:var(--deep);
  border:2px solid white;
  border-radius:14px;
  box-shadow:0 2px #f9a8d4;
  font-size:12px;
  font-weight:bold;
}

/* 퍼즐: 장면 전체를 사용 */
.play-world{flex:1;min-height:0;position:relative;overflow:hidden}
.puzzle-area{
  position:absolute;
  inset:77px 12px 146px;
  min-height:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
}
.play-dock{
  position:absolute;
  z-index:12;
  left:10px;
  right:10px;
  bottom:10px;
  display:flex;
  flex-direction:column;
  gap:7px;
}
.status{
  margin:0;
  min-height:35px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:7px 10px;
  background:#fffffff0;
  border:2px solid white;
  border-radius:15px;
  box-shadow:0 3px #db27771a;
  color:var(--deep);
  text-align:center;
  font-size:12px;
  line-height:1.5;
}
.dock-row{display:flex;gap:7px;align-items:stretch}
.primary{
  flex:1;
  min-height:43px;
  padding:9px 12px;
  border:3px solid white;
  outline:2px solid #b91c4d;
  border-radius:17px;
  box-shadow:0 4px #9f164a;
  background:linear-gradient(#ff7d87,#ed4059);
  color:white;
  font-size:14px;
  font-weight:bold;
}
.primary:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px #9f164a}
.secondary{
  background:linear-gradient(#56bb7f,#268652);
  outline-color:#17643d;
  box-shadow:0 4px #17643d;
}
.round-btn{
  min-height:40px;
  padding:8px 11px;
  background:#fff;
  color:var(--deep);
  border:2px solid #f9a8d4;
  border-radius:14px;
  font-size:11px;
  font-weight:bold;
}
.hint-text{
  margin:0;
  background:#fffef4;
  border:2px solid #fcd34d;
  border-radius:12px;
  padding:8px;
  font-size:11px;
  line-height:1.6;
}
.clue-tag{
  flex:none;
  padding:8px 12px;
  background:#fffdf2;
  border:3px solid white;
  outline:2px solid #eab85e;
  border-radius:12px;
  box-shadow:3px 3px #eab85e33;
  font-size:12px;
  line-height:1.6;
  text-align:center;
  transform:rotate(1deg);
}
.small-guide{font-size:10px;line-height:1.5;text-align:center}
.decor-star{
  position:absolute;
  pointer-events:none;
  color:#fff;
  font-size:25px;
  text-shadow:0 2px #fbbf24;
}
.floor{
  position:absolute;
  left:-20%;
  right:-20%;
  bottom:-12%;
  height:45%;
  background:repeating-linear-gradient(90deg,#fbd5b2 0 52px,#f2c098 53px 55px);
  border-top:6px solid #fff5df;
  transform:rotate(-8deg);
  opacity:.5;
}
.shelf{
  position:absolute;
  left:8%;
  right:8%;
  top:24%;
  height:18px;
  background:#c47a88;
  border:3px solid #fff;
  border-radius:4px;
  box-shadow:0 12px #f8b4c5;
}
.shelf::before{
  content:"";
  position:absolute;
  top:-65px;
  left:15px;
  width:65px;
  height:60px;
  border:3px solid white;
  border-radius:7px;
  background:repeating-linear-gradient(90deg,#f9a8d4 0 14px,#fde68a 15px 30px);
}
.tree-art{
  position:absolute;
  left:50%;
  top:16%;
  width:230px;
  height:330px;
  transform:translateX(-50%);
  opacity:.45;
}
.tree-art .tier{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:100px solid transparent;
  border-right:100px solid transparent;
  border-bottom:150px solid #6fbf91;
  filter:drop-shadow(0 3px 0 white);
}
.tree-art .tier:nth-child(1){top:0;border-left-width:63px;border-right-width:63px;border-bottom-width:110px}
.tree-art .tier:nth-child(2){top:60px;border-left-width:85px;border-right-width:85px}
.tree-art .tier:nth-child(3){top:140px}
.tree-art::after{
  content:"";
  position:absolute;
  left:99px;
  top:280px;
  width:32px;
  height:45px;
  background:#c98873;
  border:3px solid white;
}
.curtain{
  position:absolute;
  inset:0 0 auto;
  height:52%;
  background:repeating-linear-gradient(90deg,#df6b8e 0 25px,#f695b2 26px 50px);
  border-radius:0 0 50% 50%;
  border-bottom:7px solid #ffe6ba;
  opacity:.48;
}
.book-background{
  position:absolute;
  top:19%;
  left:8%;
  right:8%;
  height:170px;
  border-bottom:15px solid #c48386;
  background:repeating-linear-gradient(90deg,#f7a6be 0 24px,#fceab1 25px 48px,#a9dace 49px 72px);
  border-radius:8px;
  transform:rotate(-5deg);
  opacity:.5;
}
.bubble{
  position:absolute;
  padding:7px 10px;
  border:3px solid white;
  outline:2px solid #e879a6;
  border-radius:50%;
  background:#fff9;
  color:var(--deep);
  font-size:11px;
  transform:rotate(-8deg);
  pointer-events:none;
}

/* 입체 상자 */
.warehouse-board{
  position:relative;
  width:100%;
  flex:1;
  max-height:360px;
  min-height:230px;
  touch-action:pan-y;
}
.crate{
  position:absolute;
  width:104px;
  height:88px;
  padding:0;
  border:3px solid #a84f77;
  border-radius:9px;
  background:#fbc3da;
  box-shadow:8px 8px 0 #b9709033;
  touch-action:none;
  user-select:none;
}
.crate::before{
  content:"";
  position:absolute;
  left:-6px;
  right:-6px;
  top:-10px;
  height:24px;
  border:3px solid #a84f77;
  border-radius:6px;
  background:#ffd9e9;
  box-shadow:0 3px #a84f7722;
}
.crate::after{
  content:"";
  position:absolute;
  top:14px;
  bottom:0;
  left:42%;
  width:17%;
  background:#fff8;
  border-left:2px solid #fff;
  border-right:2px solid #fff;
}
.crate .label{
  position:absolute;
  z-index:1;
  inset:28px 12px 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  color:#9d174d;
  background:#fff9;
  border:2px dashed #fff;
  border-radius:6px;
}
.crate.mint{background:#b5e0d3;border-color:#3d9077}
.crate.mint::before{background:#d7f5e9;border-color:#3d9077}
.crate.yellow{background:#f8df91;border-color:#b28737}
.crate.yellow::before{background:#fff0ba;border-color:#b28737}
.crate.dragging{z-index:20!important;filter:drop-shadow(0 9px 5px #83184333)}
.crate.target{width:92px;height:78px;z-index:1}
.crate.target::after{background:#fde68a99}
.crate.target.ready{animation:wiggle 1.4s infinite}
.crate.target.open::before{transform:translateY(-28px) rotate(-12deg);transition:transform .35s}
.crate.target.open .label{font-size:38px;background:transparent;border:0}
.thread-board{
  position:relative;
  width:min(100%,310px);
  aspect-ratio:1;
  touch-action:none;
  filter:drop-shadow(0 9px 0 #d9987e33);
}
.thread-board svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hole{
  position:absolute;
  width:47px;
  height:47px;
  transform:translate(-50%,-50%);
  border:3px solid #b77b35;
  outline:3px solid #fff;
  border-radius:50%;
  background:#fff9e3;
  color:#a16a22;
  font-size:21px;
  touch-action:none;
  box-shadow:0 3px #b77b3533;
}
.hole.done{background:#fff0a7;box-shadow:0 0 20px #fde047}
.hole.start{outline:5px solid #fff}

/* 풍경과 렌즈 */
.city-board{
  position:relative;
  width:100%;
  flex:1;
  max-height:310px;
  min-height:210px;
  overflow:hidden;
  border:5px solid #fff;
  outline:2px solid #6aaed6;
  border-radius:24px 9px 24px 9px;
  background:#dbeafe;
}
.city-svg{position:absolute;inset:0;width:100%;height:100%}
.lens{
  position:absolute;
  width:116px;
  height:116px;
  border:7px solid #f277a1;
  outline:3px solid white;
  border-radius:50%;
  background:#fff8;
  box-shadow:4px 6px #9d174d33;
  touch-action:none;
}
.lens::after{
  content:"";
  position:absolute;
  width:17px;
  height:53px;
  background:#f277a1;
  border:3px solid white;
  border-radius:9px;
  right:-22px;
  bottom:-37px;
  transform:rotate(-36deg);
}
.lens svg{width:100%;height:100%;border-radius:50%;overflow:hidden}
.lens.matched{border-color:#eab308;box-shadow:0 0 25px #fde047}
.range-row{
  display:flex;
  align-items:center;
  gap:7px;
  width:100%;
  padding:8px;
  border:2px solid white;
  border-radius:13px;
  background:#fff9;
  font-size:11px;
}
.range-row input{min-width:0;flex:1;accent-color:#e879a6}

/* 책 / 다이얼 */
.book{
  flex:none;
  position:relative;
  width:95%;
  height:120px;
  background:#fff8dc;
  border:4px solid white;
  outline:3px solid #b86c78;
  border-radius:15px 6px 6px 15px;
  box-shadow:0 7px #e4b5ab;
  transform:rotate(-2deg);
  overflow:hidden;
}
.book::before{
  content:"";
  position:absolute;
  left:50%;
  top:0;
  bottom:0;
  width:3px;
  background:#e5cdb5;
}
.book-inside{
  position:absolute;
  inset:0;
  padding:12px;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  font-size:13px;
  line-height:1.8;
}
.book canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.lock-body{
  width:100%;
  padding:13px 10px 12px;
  background:#f7b4d0;
  border:4px solid white;
  outline:2px solid #b75d84;
  border-radius:20px;
  box-shadow:0 8px #b75d8444;
}
.dials{display:flex;gap:7px;width:100%;justify-content:center}
.dial{flex:1;max-width:65px;text-align:center}
.dial button{
  width:100%;
  min-height:24px;
  background:#fff7;
  border:1px solid #fff;
  border-radius:6px;
  color:#9d174d;
  font-size:11px;
}
.drum{
  height:74px;
  margin:4px 0;
  overflow:hidden;
  border:2px solid #9d456f;
  border-radius:9px;
  background:linear-gradient(#eedce3,#fff 38%,#fff 62%,#eedce3);
  box-shadow:inset 0 3px 5px #9d456f33;
  color:#9d174d;
  touch-action:none;
  user-select:none;
}
.drum .adjacent{height:17px;line-height:17px;opacity:.45;font-size:11px}
.drum .value{height:36px;line-height:36px;font-size:25px;font-weight:bold}
.drum.moving{filter:brightness(1.08)}

/* 연주 */
.music-labels{display:flex;gap:12px;justify-content:center;font-size:25px}
.music-labels span{
  opacity:.25;
  background:white;
  border:2px solid white;
  border-radius:50%;
  padding:5px;
}
.music-labels span.on{opacity:1;box-shadow:0 0 15px #fde68a}
.instrument{
  position:relative;
  width:100%;
  padding:20px 10px;
  background:#f89ebc;
  border:5px solid white;
  outline:3px solid #ba4a76;
  border-radius:30px 30px 20px 20px;
  box-shadow:0 10px #b96c8b66;
  transform:rotate(-2deg);
}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.key{
  position:relative;
  height:130px;
  padding-top:50px;
  border:3px solid #b46184;
  border-radius:10px;
  color:#8f345d;
  font-size:20px;
  font-weight:bold;
  background:linear-gradient(#fff,#fff0df);
  box-shadow:0 5px #c77699;
}
.key:nth-child(2){height:119px;background:linear-gradient(#fff9c6,#ffed99)}
.key:nth-child(3){height:108px;background:linear-gradient(#d8f6e8,#a9e0ca)}
.key:nth-child(4){height:97px;background:linear-gradient(#ddecff,#b3d1f9)}
.key::before{
  content:"";
  position:absolute;
  left:50%;
  top:16px;
  width:9px;
  height:9px;
  border-radius:50%;
  background:#b46184;
  transform:translateX(-50%);
}
.key.active{transform:translateY(5px);box-shadow:none;filter:brightness(1.13)}
.key.active::after{
  content:"♪";
  position:absolute;
  top:-35px;
  left:30%;
  color:#e54a88;
  animation:float-note .55s both;
}

/* 소망나무 스크래치 */
.memory{
  position:relative;
  width:100%;
  flex:1;
  max-height:340px;
  min-height:240px;
  border:5px solid #fff;
  outline:2px solid #79b399;
  border-radius:25px 9px 25px 9px;
  background:linear-gradient(#bce6d3,#fff6da);
  overflow:hidden;
}
.memory-content{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:15px;
  padding:16px;
}
.wish-paper{
  padding:9px 12px;
  max-width:95%;
  background:#fff9ed;
  border:2px solid #fff;
  outline:1px solid #efacb9;
  border-radius:3px;
  box-shadow:2px 4px #17643d22;
  transform:rotate(-5deg);
  font-size:12px;
  line-height:1.6;
}
.wish-paper:nth-child(2){transform:rotate(5deg);background:#ffe7ef}
.wish-paper:nth-child(3){transform:rotate(-2deg);background:#fff3b6}
.memory canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.memory-caption{
  position:absolute;
  inset:auto 5px 5px;
  background:#fffde9;
  border:2px solid white;
  border-radius:10px;
  padding:8px;
  text-align:center;
  font-size:12px;
  line-height:1.6;
}

/* 전선 */
.circuit-wrap{
  position:relative;
  width:min(95%,290px);
  padding:12px;
  background:#f8d1df;
  border:5px solid white;
  outline:2px solid #b7648a;
  border-radius:24px;
  box-shadow:0 8px #b7648a44;
}
.circuit{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}
.pipe{
  aspect-ratio:1;
  min-width:0;
  padding:5px;
  background:linear-gradient(#fff,#f6e9f0);
  border:2px solid #c597b0;
  border-radius:12px;
  box-shadow:0 3px #c597b0;
}
.pipe svg{width:100%;height:100%;display:block}
.pipe.lit{
  background:#fff5b8;
  border-color:#d6ac33;
  box-shadow:0 0 14px #facc1588;
}
.circuit-badge{
  padding:6px 12px;
  border:2px solid white;
  border-radius:14px;
  background:#fff9;
  font-size:12px;
  color:#a8631b;
}
.final-star{
  position:absolute;
  inset:0;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff6dcb0;
  pointer-events:none;
}
.final-star span{font-size:105px;animation:ascend 1.9s ease-in forwards}

.outro-panel{
  position:absolute;
  left:10px;
  right:10px;
  bottom:15px;
  padding:15px;
  border:4px solid white;
  outline:2px solid #e879a6;
  border-radius:22px;
  background:#fff1f5ed;
  text-align:center;
}
.outro-panel h1{font-size:22px;color:var(--deep)}
.outro-panel p{font-size:13px;line-height:1.8}
.outro-panel small{display:block;font-size:10px;margin-bottom:14px}
.modal{
  position:absolute;
  inset:0;
  z-index:100;
  padding:22px;
  background:#52344988;
  backdrop-filter:blur(3px);
  display:flex;
  align-items:center;
  justify-content:center;
}
.modal-card{
  width:100%;
  max-height:90%;
  overflow:auto;
  padding:22px 17px;
  background:#fffaf1;
  border:5px solid white;
  outline:3px solid #d35d8c;
  border-radius:27px 12px 27px 12px;
  box-shadow:0 8px #a63d6d66;
  text-align:center;
}
.modal h2{color:var(--deep);font-size:20px}
.modal p{font-size:13px;line-height:1.8;white-space:pre-wrap}
.modal .primary{width:100%;margin-top:8px}
.particle{
  position:absolute;
  z-index:90;
  pointer-events:none;
  font-size:22px;
  color:#f59e0b;
  animation:particle .9s ease-out forwards;
}
@keyframes wiggle{40%{transform:rotate(-4deg)}60%{transform:rotate(4deg)}}
@keyframes float-note{to{transform:translateY(-30px);opacity:0}}
@keyframes ascend{20%{transform:scale(1.2)}to{transform:translateY(-280px) scale(.25);opacity:0}}
@keyframes particle{to{transform:translate(var(--dx),var(--dy)) rotate(120deg);opacity:0}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.shake{animation:shake .23s}
@media(max-height:650px){
  .puzzle-area{inset:65px 10px 135px;gap:8px}
  .ribbon{top:8px;padding:7px;font-size:13px}
  .warehouse-board{min-height:190px}
  .thread-board{width:min(80%,235px)}
  .book{height:85px}
  .book-inside{padding:5px;font-size:11px}
  .lock-body{padding:8px}
  .drum{height:64px}
  .drum .value{height:26px;line-height:26px}
  .key{height:100px}
  .key:nth-child(2){height:92px}
  .key:nth-child(3){height:84px}
  .key:nth-child(4){height:76px}
  .memory{min-height:190px}
  .circuit-wrap{width:min(76%,225px);padding:8px}
  .dialogue{min-height:148px;height:148px}
}
@media(max-width:360px){
  .message{font-size:12px}
  .tool{font-size:9px;padding:5px}
  .ribbon{font-size:13px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important}
}

let state = {stage:0,phase:"intro"};
let resumePoint = null;
let screenVersion = 0;
let timers = [];
let cleanups = [];
let typingTimer = null;
let finishTyping = null;
let locked = false;
let modalCallback = null;
let previousFocus = null;
let saveEnabled = true;

function esc(value){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function later(fn,ms){
  const version = screenVersion;
  const id = setTimeout(()=>{
    if(version === screenVersion) fn();
  },ms);
  timers.push(id);
  return id;
}
function cleanScreen(){
  clearInterval(typingTimer);
  typingTimer = null;
  finishTyping = null;
  timers.forEach(clearTimeout);
  timers = [];
  cleanups.forEach(fn=>fn());
  cleanups = [];
  screenVersion++;
  stopVoices("game");
  $("screen").replaceChildren();
}
function save(){
  if(!saveEnabled) return;
  try{
    localStorage.setItem(SAVE_KEY,JSON.stringify(state));
  }catch(e){
    saveEnabled = false;
  }
}
function loadSave(){
  try{
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if(
      s && Number.isInteger(s.stage) && s.stage>=0 && s.stage<7 &&
      ["before","guide","puzzle","after","epilogue","outro"].includes(s.phase)
    ) return s;
  }catch(e){}
  return null;
}
function setChrome(introMode){
  $("topbar").hidden = introMode;
  $("debug").hidden = introMode || !TEST_MODE;
}
function navigate(phase,stage=state.stage){
  cleanScreen();
  state = {phase,stage};
  locked = false;
  save();
  setChrome(phase==="intro");

  $("progress").textContent =
    phase==="outro" ? "탐험 완료!" :
    phase==="epilogue" ? "에필로그" :
    `미션 ${stage+1}/7`;

  $("jump").value = stage;
  $("pass").disabled = !["before","guide","puzzle"].includes(phase);

  if(phase==="intro") renderIntro();

  if(phase==="before"){
    renderDialogue(
      BEFORE[stage],
      ()=>navigate("guide"),
      TITLES[stage],
      `image_0${stage+1}.png`
    );
  }
  if(phase==="guide") renderGuide();
  if(phase==="puzzle") renderPuzzle();

  if(phase==="after"){
    renderDialogue(
      AFTER[stage],
      ()=>stage===6 ? navigate("epilogue") : navigate("before",stage+1),
      "무슨 일이 생겼지?",
      `image_0${stage+1}.png`
    );
  }
  if(phase==="epilogue"){
    renderDialogue(
      EPILOGUE,
      ()=>navigate("outro"),
      "아직 읽을 이야기가 많아!",
      "image_08.png"
    );
  }
  if(phase==="outro") renderOutro();

  if(audio) stopVoices("bgm");
}

function renderIntro(){

  $("screen").innerHTML = `
    <section class="intro" id="intro-root">
      <div class="intro-plane" id="intro-plane">
        <div class="intro-fallback" id="intro-fallback" hidden>
          <span class="big">🎄⭐</span>

        </div>
        <img class="intro-image" id="intro-image"
             src="${INTRO.file}" alt="해치 크리스마스 인트로">
        <h1 class="intro-title" id="intro-title">
          해치 크리스마스
          <small>오래된 별의 자리</small>
        </h1>
        <div class="intro-fallback-start" id="intro-fallback-start" hidden>
          시작하기
        </div>
        <button class="intro-start" id="intro-start"
                aria-label="탐험 시작하기"></button>
      </div>
    </section>
  `;

  let sourceWidth = INTRO.fallbackWidth;
  let sourceHeight = INTRO.fallbackHeight;
  let imageMissing = false;

  const root = $("intro-root");
  const plane = $("intro-plane");
  const image = $("intro-image");
  const title = $("intro-title");
  const button = $("intro-start");
  const fallbackButton = $("intro-fallback-start");

  function place(element,rect,scale){
    element.style.left = rect.x*scale+"px";
    element.style.top = rect.y*scale+"px";
    element.style.width = rect.width*scale+"px";
    element.style.height = rect.height*scale+"px";
  }
  function layout(){
    const scale = Math.min(
      root.clientWidth/sourceWidth,
      root.clientHeight/sourceHeight
    );

    plane.style.width = sourceWidth*scale+"px";
    plane.style.height = sourceHeight*scale+"px";

    place(title,INTRO.title,scale);
    place(button,INTRO.start,scale);
    place(fallbackButton,INTRO.start,scale);

    title.style.fontSize = 50*scale+"px";
    title.style.letterSpacing = -1.5*scale+"px";
    fallbackButton.style.fontSize = 31*scale+"px";

    fallbackButton.hidden = !imageMissing;
  }

  image.onload = ()=>{
    sourceWidth = image.naturalWidth;
    sourceHeight = image.naturalHeight;
    imageMissing = false;
    $("intro-fallback").hidden = true;
    layout();
  };
  image.onerror = ()=>{
    imageMissing = true;
    image.hidden = true;
    $("intro-fallback").hidden = false;
    layout();
  };

  const observer = new ResizeObserver(layout);
  observer.observe(root);
  cleanups.push(()=>observer.disconnect());

  if(image.complete && image.naturalWidth){
    sourceWidth = image.naturalWidth;
    sourceHeight = image.naturalHeight;
  }
  layout();

  button.onclick = ()=>{
    unlockAudio();

    if(resumePoint){
      const point = {...resumePoint};
      openModal(
        "이어서 탐험할까요?",
        "이전에 진행한 미션이 남아 있어요.",
        ()=>{
          resumePoint = null;
          navigate(point.phase,point.stage);
        },
        "이어서 하기",
        "⭐",
        ()=>{
          resumePoint = null;
          navigate("before",0);
        },
        "처음부터 시작"
      );
    }else{
      navigate("before",0);
    }
  };
}

function renderDialogue(lines,done,title,image){
  let index = 0;

  $("screen").innerHTML = `

      ${storyArt(image,title)}
      <div class="dialogue">

  function showLine(){
    const line = lines[index];

    $("sender").textContent = line.kind==="note" ? "이야기" : line.name;
    $("message").classList.toggle("narration",line.kind==="note");

    }

    $("next").textContent =
      index===lines.length-1
        ? state.phase==="before" ? "어디로 갈까? ▶" : "계속하기 ▶"
        : "다음 ▶";

    typeText(
      $("message"),
      line.kind==="note" ? `(${line.text})` : line.text,
      $("next")
    );
  }

  $("message").onclick = ()=>finishTyping?.();

      return;
    }
    if(index<lines.length-1){
      index++;
      showLine();
    }else{
      done();
    }
  };

  showLine();
}

function typeText(element,text,button){
  clearInterval(typingTimer);
  element.textContent = "";
  element.scrollTop = 0;
  button.hidden = true;

  const letters = Array.from(text);
  let index = 0;

  finishTyping = ()=>{
    clearInterval(typingTimer);
    typingTimer = null;
    element.textContent = text;
    button.hidden = false;
    finishTyping = null;
  };

  if(reduced()){
    finishTyping();
    return;
  }

  typingTimer = setInterval(()=>{
    element.textContent += letters[index++];
    if(index%4===0) sfx(850,.015,.005);
    if(index>=letters.length) finishTyping?.();
  },25);
}

   1. 장면 속 상자 옮기기
======================================================== */
function puzzleBoxes(){
  $("play-area").innerHTML = `
    <div class="bubble" style="top:0;left:5%">이 밑에 있나?</div>
    <div class="warehouse-board" id="warehouse-board">
      <button class="crate target" id="target-box"
              aria-label="별 장식 상자">
        <span class="label">★</span>
      </button>
    </div>
    <div class="small-guide">상자를 누른 채 끌어서 옮겨보세요.</div>`;

  const board = $("warehouse-board");
  const target = $("target-box");
  const props = [];
  const W = board.clientWidth;
  const H = board.clientHeight;

  const targetX = W/2-46;
  const targetY = H/2-39;

  target.style.left = targetX+"px";
  target.style.top = targetY+"px";

  const starts = [
    {x:W/2-92,y:H/2-71,label:"리본",class:""},
    {x:W/2-12,y:H/2-34,label:"장식",class:"mint"},
    {x:W/2-72,y:H/2+1,label:"선물",class:"yellow"}
  ];

  function overlap(a,b){
    return Math.max(0,Math.min(a.right,b.right)-Math.max(a.left,b.left))*
           Math.max(0,Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top));
  }

  function check(){
    const rect = target.getBoundingClientRect();
    const cleared = props.filter(p=>
      overlap(p.getBoundingClientRect(),rect)<80
    ).length;

    target.disabled = cleared<3;
    target.classList.toggle("ready",cleared===3);

    status(
      cleared===3
        ? "찾았다! 작은 별 상자를 열어봐!"
        : `상자를 끌어서 치워보자! ${cleared}/3`
    );
  }

  starts.forEach((start,index)=>{
    const b = document.createElement("button");
    b.className = `crate ${start.class}`;
    b.style.left = clamp(start.x,0,W-104)+"px";
    b.style.top = clamp(start.y,10,H-88)+"px";
    b.style.zIndex = 4+index;
    b.innerHTML = `<span class="label">${start.label}</span>`;
    b.setAttribute("aria-label",start.label+" 상자. 끌거나 방향키로 이동");
    board.append(b);
    props.push(b);

    let drag = null;

    b.onpointerdown = e=>{
      if(locked) return;
      const r = b.getBoundingClientRect();
      drag = {dx:e.clientX-r.left,dy:e.clientY-r.top};
      b.setPointerCapture(e.pointerId);
      b.classList.add("dragging");
    };
    b.onpointermove = e=>{
      if(!drag) return;
      const r = board.getBoundingClientRect();

      b.style.left = clamp(
        e.clientX-r.left-drag.dx,0,board.clientWidth-b.offsetWidth
      )+"px";
      b.style.top = clamp(
        e.clientY-r.top-drag.dy,10,board.clientHeight-b.offsetHeight
      )+"px";

      check();
    };
    const end = ()=>{
      drag = null;
      b.classList.remove("dragging");
      check();
    };
    b.onpointerup = end;
    b.onpointercancel = end;
    b.onkeydown = e=>{
      const directions = {
        ArrowLeft:[-15,0],ArrowRight:[15,0],
        ArrowUp:[0,-15],ArrowDown:[0,15]
      };
      if(!directions[e.key] || locked) return;
      e.preventDefault();

      b.style.left = clamp(
        parseFloat(b.style.left)+directions[e.key][0],
        0,board.clientWidth-b.offsetWidth
      )+"px";
      b.style.top = clamp(
        parseFloat(b.style.top)+directions[e.key][1],
        10,board.clientHeight-b.offsetHeight
      )+"px";

      check();
    };
  });

  target.onclick = ()=>{
    if(target.disabled || locked) return;
    target.classList.remove("ready");
    target.classList.add("open");
    target.querySelector(".label").textContent = "⭐";
    solve("데굴! 상자 속에서 오래된 별 장식이 나왔어요.",650);
  };

  $("reset-puzzle").hidden = false;
  $("reset-puzzle").onclick = ()=>{
    props.forEach((b,i)=>{
      b.style.left = clamp(starts[i].x,0,W-104)+"px";
      b.style.top = clamp(starts[i].y,10,H-88)+"px";
    });
    check();
  };

  check();
}

function puzzleThread(){
  const points = [
    {x:22,y:24,icon:"☀"},

    {x:22,y:77,icon:"★"},
    {x:78,y:77,icon:"♥"}

  let input = [];
  let dragging = false;
  let cursor = null;
  let tapMode = false;

  $("play-area").innerHTML = `

    <div class="thread-board" id="thread-board">
      <svg viewBox="0 0 100 100">
        <path d="M50 4 L61 34 L94 36 L68 56 L77 90 L50 71 L23 90 L32 56 L6 36 L39 34 Z"
          fill="#fff0a5" stroke="white" stroke-width="3"/>
        <path d="M50 10 L59 37 L86 39 L64 55 L71 80 L50 65 L29 80 L36 55 L14 39 L41 37 Z"
          fill="none" stroke="#e5b64b" stroke-width="1" stroke-dasharray="2 2"/>
        <polyline id="thread-fixed" fill="none" stroke="#ed4d78"
          stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
        <line id="thread-live" stroke="#f472b6" stroke-width="1.8" stroke-dasharray="3 2"/>

  const board = $("thread-board");

  function draw(){
    $("thread-fixed").setAttribute(
      "points",
      input.map(i=>`${points[i].x},${points[i].y}`).join(" ")
    );

    const last = points[input.at(-1)];
    const line = $("thread-live");

    line.setAttribute("x1",last?.x??0);
    line.setAttribute("y1",last?.y??0);
    line.setAttribute("x2",cursor?.x??last?.x??0);
    line.setAttribute("y2",cursor?.y??last?.y??0);

    board.querySelectorAll(".hole").forEach((b,i)=>{
      b.classList.toggle("done",input.includes(i));
    });
  }
  function reset(message="해 그림을 잡고 출발해 주세요."){
    input = [];
    dragging = false;
    cursor = null;
    draw();
    status(message);
  }
  function take(index){
    if(input.includes(index)) return;

    if(target[input.length]!==index){
      reset("앗, 끈이 꼬였어! 해에서 다시 출발!");
      return;
    }

    input.push(index);
    sfx(450+input.length*100,.08,.025);
    draw();
    status(`끈 꿰기 ${input.length}/4`);

    if(tapMode && input.length===4){
      solve("새 끈 완성! 이제 별을 트리에 걸 수 있어요.");
    }
  }

  points.forEach((p,i)=>{
    const b = document.createElement("button");
    b.className = "hole"+(i===0?" start":"");
    b.style.left = p.x+"%";
    b.style.top = p.y+"%";
    b.textContent = p.icon;
    b.setAttribute("aria-label",p.icon+" 구멍");
    b.onclick = ()=>{
      if(tapMode && !locked) take(i);
    };
    board.append(b);
  });

  function pos(e){
    const r = board.getBoundingClientRect();
    return {
      x:(e.clientX-r.left)/r.width*100,
      y:(e.clientY-r.top)/r.height*100
    };
  }

  board.onpointerdown = e=>{
    if(tapMode || locked) return;

    const p = pos(e);
    if(Math.hypot(p.x-points[0].x,p.y-points[0].y)>14){
      status("해 그림에서 끈을 잡고 시작해 주세요.");
      return;
    }

    input = [];
    dragging = true;
    cursor = p;
    board.setPointerCapture(e.pointerId);
    take(0);
  };
  board.onpointermove = e=>{
    if(!dragging || locked) return;
    cursor = pos(e);

    const index = points.findIndex(p=>
      Math.hypot(cursor.x-p.x,cursor.y-p.y)<11
    );
    if(index>=0) take(index);
    if(dragging) draw();
  };
  board.onpointerup = ()=>{
    if(!dragging) return;
    dragging = false;
    cursor = null;
    draw();

    if(input.length===4){
      solve("새 끈 완성! 이제 별을 트리에 걸 수 있어요.");
    }else{
      reset("중간에 손을 놓았네! 다시 해에서 출발해 보자.");
    }
  };
  board.onpointercancel = ()=>reset();

  $("assist").hidden = false;
  $("assist").textContent = "누르기로 꿰기";
  $("assist").onclick = ()=>{
    tapMode = !tapMode;
    $("assist").textContent = tapMode ? "끌어서 꿰기" : "누르기로 꿰기";
    reset(tapMode ? "그림을 순서대로 눌러주세요." : undefined);
  };

  status("해를 잡고, 손을 떼지 않은 채 끈을 이어보세요.");
}

function puzzleLens(){
  let x = 75;
  let y = 85;
  let zoom = 1;
  let drag = null;

  $("play-area").innerHTML = `
    <div class="clue-tag">“물가의 높은 탑! 둥근 전망대가 있었어.”</div>
    <div class="city-board" id="city-board">
      ${citySVG()}
      <div class="lens" id="lens" tabindex="0"
           role="slider" aria-label="기억 렌즈. 방향키로 이동"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="20">
        <svg viewBox="-50 -50 100 100">
          <g id="memory-tower" fill="#fff6" stroke="#db2777"
             stroke-width="2.5" stroke-dasharray="3 2">
            <path d="M-8 58 L-4-4 H4 L8 58Z"/>
            <rect x="-17" y="-14" width="34" height="16" rx="4"/>
            <path d="M0-14V-39" fill="none"/>
          </g>
        </svg>
      </div>
    </div>
    <div class="range-row">
      <span>기억 크기</span>
      <input id="zoom" type="range" min="80" max="160" value="100"
             aria-label="기억 확대율">
      <span id="zoom-value">100%</span>
    </div>`;

  const board = $("city-board");
  const lens = $("lens");

  function target(){
    return {
      x:board.clientWidth*224/330,
      y:board.clientHeight*123/275
    };
  }
  function draw(){
    lens.style.left = x-58+"px";
    lens.style.top = y-58+"px";
    $("memory-tower").setAttribute("transform",`scale(${zoom})`);
    lens.setAttribute("aria-valuenow",Math.round(x/board.clientWidth*100));

    const t = target();
    const distance = Math.hypot(x-t.x,y-t.y);
    const matched = distance<18 && Math.abs(zoom-1.25)<.09;

    lens.classList.toggle("matched",matched);

    status(
      matched
        ? "반짝! 기억 속 풍경과 겹쳐졌어!"
        : distance<35
          ? "이 근처야! 크기도 조금 맞춰보자."
          : "렌즈를 끌어 물가의 높은 탑을 찾아보세요."
    );
  }

  lens.onpointerdown = e=>{
    if(locked) return;
    const r = board.getBoundingClientRect();
    drag = {
      dx:e.clientX-r.left-x,
      dy:e.clientY-r.top-y
    };
    lens.setPointerCapture(e.pointerId);
  };
  lens.onpointermove = e=>{
    if(!drag) return;
    const r = board.getBoundingClientRect();

    x = clamp(e.clientX-r.left-drag.dx,58,board.clientWidth-58);
    y = clamp(e.clientY-r.top-drag.dy,58,board.clientHeight-58);
    draw();
  };
  lens.onpointerup = ()=>{drag=null};
  lens.onpointercancel = ()=>{drag=null};
  lens.onkeydown = e=>{
    const moves = {
      ArrowLeft:[-5,0],ArrowRight:[5,0],
      ArrowUp:[0,-5],ArrowDown:[0,5]
    };
    if(!moves[e.key] || locked) return;
    e.preventDefault();

    x = clamp(x+moves[e.key][0],58,board.clientWidth-58);
    y = clamp(y+moves[e.key][1],58,board.clientHeight-58);
    draw();
  };
  $("zoom").oninput = e=>{
    zoom = Number(e.target.value)/100;
    $("zoom-value").textContent = e.target.value+"%";
    draw();
  };

  action("이 풍경이야!",()=>{
    const t = target();

    if(Math.hypot(x-t.x,y-t.y)<18 && Math.abs(zoom-1.25)<.09){
      solve("풍경이 딱 겹쳐지자 별의 기억이 반짝였어요.");
    }else{
      fail("렌즈의 위치와 크기를 함께 맞춰주세요. 테두리가 노랗게 빛나면 준비 완료!");
    }
  });

  draw();
}

/* ========================================================
   공용 스크래치
======================================================== */
function makeScratch(canvas,{kind="dust",threshold=.45,onDone,onProgress}){
  const rect = canvas.getBoundingClientRect();

  canvas.width = Math.max(1,Math.round(rect.width));
  canvas.height = Math.max(1,Math.round(rect.height));

  const ctx = canvas.getContext("2d",{willReadFrequently:true});
  const gradient = ctx.createLinearGradient(0,0,canvas.width,canvas.height);

  gradient.addColorStop(0,kind==="fog"?"#d8e7ee":"#d5bdb5");
  gradient.addColorStop(1,kind==="fog"?"#a9c4d1":"#b99792");

  ctx.fillStyle = gradient;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  for(let i=0;i<100;i++){
    ctx.fillStyle = i%2 ? "#ffffff25" : "#ffffff55";
    ctx.beginPath();
    ctx.arc(
      Math.random()*canvas.width,
      Math.random()*canvas.height,
      Math.random()*7+1,0,Math.PI*2
    );
    ctx.fill();
  }

  ctx.textAlign = "center";
  ctx.fillStyle = "white";
  ctx.font = "bold 13px sans-serif";
  ctx.fillText(
    kind==="fog" ? "슥슥 닦아보세요" : "먼지를 슥슥 닦아보세요",
    canvas.width/2,canvas.height/2
  );

  let drawing = false;
  let last = null;
  let moves = 0;
  let done = false;

  function reveal(){
    if(done) return;
    done = true;
    canvas.hidden = true;
    onDone();
  }
  function estimate(){
    if(done) return;

    const data = ctx.getImageData(0,0,canvas.width,canvas.height).data;
    let erased = 0;
    let total = 0;

    for(let i=3;i<data.length;i+=80){
      total++;
      if(data[i]<60) erased++;
    }

    const ratio = erased/total;
    onProgress?.(Math.round(ratio*100));
    if(ratio>=threshold) reveal();
  }
  function erase(e){
    if(!drawing || done) return;

    const r = canvas.getBoundingClientRect();
    const p = {
      x:(e.clientX-r.left)*canvas.width/r.width,
      y:(e.clientY-r.top)*canvas.height/r.height
    };

    ctx.globalCompositeOperation = "destination-out";
    ctx.lineWidth = kind==="fog" ? 43 : 30;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(last?.x??p.x,last?.y??p.y);
    ctx.lineTo(p.x+.01,p.y+.01);
    ctx.stroke();

    last = p;
    if(++moves%5===0) estimate();
  }

  canvas.onpointerdown = e=>{
    drawing = true;
    last = null;
    canvas.setPointerCapture(e.pointerId);
    erase(e);
  };
  canvas.onpointermove = erase;
  canvas.onpointerup = ()=>{
    drawing = false;
    last = null;
    estimate();
  };
  canvas.onpointercancel = ()=>{
    drawing = false;
    last = null;
  };

  return reveal;
}

/* ========================================================
   4. 책 표식 발견 + 관성 다이얼
======================================================== */
function puzzleDial(){
  const letters = ["별","나","라","무","달","빛","꿈","집"];
  const values = [4,5,6,7];
  const target = ["별","나","라","무"];

  let revealed = false;

  $("play-area").innerHTML = `
    <div class="book">
      <div class="book-inside">
        별사탕 · 나무 · 라디오 · 무지개<br>
        이름의 첫 글자를 모아봐!
      </div>
      <canvas id="book-scratch" aria-label="책 표면의 먼지 닦기"></canvas>
    </div>
    <div class="lock-body">
      <div class="dials" id="dials"></div>
    </div>
    <div class="small-guide">다이얼을 위아래로 밀면 휙 돌아가요.</div>`;

  const reveal = makeScratch($("book-scratch"),{
    threshold:.4,
    onDone:()=>{
      revealed = true;
      $("assist").hidden = true;
      status("그림 이름의 첫 글자! 다이얼을 맞춰보자.");
      sfx(880,.13,.025);
    }
  });

  $("assist").hidden = false;
  $("assist").textContent = "책 펼쳐보기";
  $("assist").onclick = reveal;

  values.forEach((_,index)=>{
    const col = document.createElement("div");
    col.className = "dial";
    col.innerHTML = `
      <button aria-label="${index+1}번째 다이얼 이전">▲</button>
      <div class="drum" tabindex="0" role="spinbutton"
           aria-label="${index+1}번째 글자"
           aria-valuemin="0" aria-valuemax="7">
        <div class="adjacent"></div>
        <div class="value"></div>
        <div class="adjacent"></div>
      </div>
      <button aria-label="${index+1}번째 다이얼 다음">▼</button>`;

    $("dials").append(col);

    const drum = col.querySelector(".drum");
    let token = 0;
    let start = null;
    let lastY = 0;
    let lastTime = 0;
    let velocity = 0;
    let carry = 0;

    function render(){
      const v = values[index];
      drum.children[0].textContent = letters[(v+7)%8];
      drum.children[1].textContent = letters[v];
      drum.children[2].textContent = letters[(v+1)%8];
      drum.setAttribute("aria-valuenow",v);
      drum.setAttribute("aria-valuetext",letters[v]);
    }
    function step(delta){
      if(locked) return;
      values[index] = (values[index]+delta+8)%8;
      render();
      sfx(320,.025,.01);
    }
    function coast(speed,currentToken){
      if(Math.abs(speed)<.13 || token!==currentToken || locked){
        drum.classList.remove("moving");
        return;
      }
      step(speed>0?1:-1);
      later(()=>coast(speed*.65,currentToken),70);
    }

    col.children[0].onclick = ()=>{token++;step(-1)};
    col.children[2].onclick = ()=>{token++;step(1)};

    drum.onpointerdown = e=>{
      if(locked) return;
      token++;
      start = e.clientY;
      lastY = e.clientY;
      lastTime = performance.now();
      velocity = 0;
      carry = 0;
      drum.setPointerCapture(e.pointerId);
      drum.classList.add("moving");
    };
    drum.onpointermove = e=>{
      if(start===null) return;

      const now = performance.now();
      const dy = lastY-e.clientY;

      velocity = dy/Math.max(now-lastTime,1);
      carry += dy;

      while(Math.abs(carry)>=23){
        const direction = carry>0?1:-1;
        step(direction);
        carry -= direction*23;
      }

      lastY = e.clientY;
      lastTime = now;
    };
    drum.onpointerup = ()=>{
      if(start===null) return;
      start = null;

      if(performance.now()-lastTime>100) velocity=0;
      coast(clamp(velocity,-2.5,2.5),token);
    };
    drum.onpointercancel = ()=>{
      start = null;
      token++;
      drum.classList.remove("moving");
    };
    drum.onkeydown = e=>{
      if(e.key==="ArrowUp" || e.key==="ArrowDown"){
        e.preventDefault();
        token++;
        step(e.key==="ArrowUp"?1:-1);
      }
    };
    drum.addEventListener("wheel",e=>{
      e.preventDefault();
      token++;
      step(e.deltaY>0?1:-1);
    },{passive:false});

    cleanups.push(()=>token++);
    render();
  });

  action("상자 열기",()=>{
    if(!revealed){
      status("먼저 책 위의 숨은 표시를 찾아보자!");
      return;
    }
    if(values.every((v,i)=>letters[v]===target[i])){
      solve("달칵! 작은 방의 기억이 상자 안에서 나왔어요.");
    }else{
      fail("책에 적힌 이름의 첫 글자를 왼쪽부터 맞춰주세요.");
    }
  });

  status("책 표면을 닦아 숨은 단서를 찾아보세요.");
}

/* ========================================================
   5. 장난감 악기 연주
======================================================== */
function puzzleMusic(){
  const names = ["도","레","미","솔"];
  const midi = [60,62,64,67];
  const phrases = [[2,2,3],[0,1,2],[3,2,1,0]];

  let round = 0;
  let input = [];
  let listening = false;
  let heard = false;
  let sequenceToken = 0;

  $("play-area").innerHTML = `
    <div class="music-labels" aria-label="완성된 반주">
      <span id="layer-0">♩</span>
      <span id="layer-1">♫</span>
      <span id="layer-2">✦</span>
    </div>
    <div class="instrument">
      <div class="keys" id="keys"></div>
    </div>
    <div class="clue-tag">맞힐 때마다 반주가 하나씩 늘어나요!</div>`;

  const listen = action("♫ 첫 구절 듣기",playPhrase,true);

  function flash(index,duration=240){
    const b = $(`key-${index}`);
    if(!b) return;
    b.classList.add("active");
    later(()=>b.classList.remove("active"),duration);
  }
  function playPhrase(){
    if(listening || locked) return;

    unlockAudio();
    stopVoices("game");

    input = [];
    heard = false;
    listening = true;
    listen.disabled = true;

    const token = ++sequenceToken;
    const phrase = phrases[round];
    const beat = .48;

    phrase.forEach((n,i)=>{
      later(()=>{
        if(token!==sequenceToken) return;
        flash(n);
        bell(midi[n],.42,.12,"game");
        accompaniment(round,i,beat);
        status(`${round+1}번째 구절 듣는 중 · ${names[n]}`);
      },i*beat*1000);
    });

    later(()=>{
      if(token!==sequenceToken) return;
      listening = false;
      heard = true;
      listen.disabled = false;
      listen.textContent = "♫ 이번 구절 다시 듣기";
      status(`이제 따라 쳐보세요! ${round+1}/3 구절`);
    },phrase.length*beat*1000+130);
  }

  names.forEach((name,index)=>{
    const b = document.createElement("button");
    b.className = "key";
    b.id = `key-${index}`;
    b.textContent = name;

    b.onclick = ()=>{
      if(listening || locked) return;

      if(!heard){
        status("먼저 듣기 버튼을 눌러보자!");
        return;
      }

      unlockAudio();
      flash(index);
      bell(midi[index],.38,.12,"game");

      const target = phrases[round];

      if(index!==target[input.length]){
        input = [];
        status("앗, 한 번만 다시! 다시 들을 수도 있어요.");
        return;
      }

      input.push(index);
      status(`${round+1}/3 구절 · ${input.map(n=>names[n]).join(" → ")}`);

      if(input.length===target.length){
        $(`layer-${round}`).classList.add("on");
        input = [];
        heard = false;
        round++;

        if(round===3){
          performance();
          return;
        }

        listening = true;
        listen.disabled = true;
        successSound();
        status("좋아! 반주가 하나 늘었어. 다음 구절로!");

        later(()=>{
          listening = false;
          listen.disabled = false;
          listen.textContent = `♫ ${round+1}번째 구절 듣기`;
        },650);
      }
    };

    $("keys").append(b);
  });

  function performance(){
    listening = true;
    listen.disabled = true;
    status("완성! 이번에는 반주와 함께 들어봐!");

    const full = phrases.flat();
    const beat = .34;

    full.forEach((n,i)=>{
      later(()=>{
        flash(n,190);
        bell(midi[n],.42,.12,"game");
        accompaniment(3,i,beat);
      },i*beat*1000);
    });

    later(()=>{
      solve("작은 연주 완성! 별이 노래를 따라 부르기 시작했어요.");
    },full.length*beat*1000+300);
  }

  $("reset-puzzle").hidden = false;
  $("reset-puzzle").textContent = "입력 지우기";
  $("reset-puzzle").onclick = ()=>{
    if(listening || locked) return;
    input = [];
    status("이번 구절을 처음 음부터 다시 쳐보세요.");
  };

  cleanups.push(()=>sequenceToken++);
  status("먼저 멜로디를 들어보세요. 건반도 함께 빛나요.");
}

function accompaniment(level,index,beat){
  if(!unlockAudio()) return;

  const chord = index%4<2 ? [60,64,67] : [55,59,62];

  if(level>=1){
    synth(chord[0]-24,beat*.8,.05,"triangle",0,"game");
  }
  if(level>=2){
    chord.forEach((n,i)=>{

}

/* ========================================================
   7. 전선 회전 / 빛 전달
======================================================== */
function rotateMask(mask){
  return ((mask<<1)&15)|((mask>>3)&1);
}
function connected(masks){
  const visited = new Set();
  if(!(masks[0]&8)) return visited;

  const queue = [0];

  while(queue.length){
    const i = queue.shift();
    if(visited.has(i)) continue;
    visited.add(i);

    const row = Math.floor(i/3);
    const col = i%3;

    [
      [1,-3,4,row>0],
      [2,1,8,col<2],
      [4,3,1,row<2],
      [8,-1,2,col>0]
    ].forEach(([bit,delta,other,valid])=>{
      if(
        valid &&
        (masks[i]&bit) &&
        (masks[i+delta]&other) &&
        !visited.has(i+delta)
      ){
        queue.push(i+delta);
      }
    });
  }
  return visited;
}
function circuitComplete(masks){
  if(connected(masks).size!==9 || !(masks[8]&2)) return false;

  for(let i=0;i<9;i++){
    const row = Math.floor(i/3);
    const col = i%3;

    for(const [bit,delta,other,valid] of [
      [1,-3,4,row>0],
      [2,1,8,col<2],
      [4,3,1,row<2],
      [8,-1,2,col>0]
    ]){
      if(!(masks[i]&bit)) continue;

      if(!valid){
        if(!((i===0&&bit===8)||(i===8&&bit===2))) return false;
      }else if(!(masks[i+delta]&other)){
        return false;
      }
    }
  }

  return true;
}

function puzzleCircuit(){
  const solution = [10,10,12,6,10,9,3,10,10];
  const turns = [1,1,2,1,1,2,3,1,1];

  function make(){
    return solution.map((m,i)=>{
      for(let n=0;n<turns[i];n++) m=rotateMask(m);
      return m;
    });
  }

  let masks = make();
  let waveToken = 0;
  let testing = false;

  $("play-area").innerHTML = `
    <div class="circuit-badge">입구 ➜ 첫 번째 줄 왼쪽</div>
    <div class="circuit-wrap">
      <div class="circuit" id="circuit"></div>
    </div>
    <div class="circuit-badge">마지막 줄 오른쪽 ➜ ⭐</div>`;

  const send = action("빛 보내기!",()=>{
    if(locked || testing) return;

    testing = true;
    send.disabled = true;
    draw();

    const duration = wave(true);

    if(circuitComplete(masks)){
      locked = true;

      later(()=>{
        const fx = document.createElement("div");
        fx.className = "final-star";
        fx.innerHTML = "<span>🌟</span>";
        $("screen").append(fx);

        celebrate();
        successSound();

        later(()=>{
          openModal(
            "별이 떠오른다!",
            "이어진 빛이 별에게 모여들기 시작했어요.",
            ()=>navigate("after"),
            "별을 따라 보기 ▶",
            "🌟"
          );
        },1800);
      },duration+150);
    }else{
      later(()=>{
        testing = false;
        send.disabled = false;
        fail("빛이 멈춘 곳을 살펴보세요. 아홉 칸을 모두 지나 출구까지 이어져야 해요!");
      },duration+150);
    }
  });

  function draw(){
    $("circuit").innerHTML = "";

    masks.forEach((mask,index)=>{
      const b = document.createElement("button");
      b.className = "pipe";
      b.id = `pipe-${index}`;

      const paths = [];
      const labels = [];

      [
        [1,50,0,"위"],[2,100,50,"오른쪽"],
        [4,50,100,"아래"],[8,0,50,"왼쪽"]
      ].forEach(([bit,x,y,label])=>{
        if(mask&bit){
          paths.push(`<path d="M50 50 L${x} ${y}"/>`);
          labels.push(label);
        }
      });

      b.innerHTML = `
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <g fill="none" stroke="#bc91aa" stroke-width="16" stroke-linecap="round">
            ${paths.join("")}
          </g>
          <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".7">
            ${paths.join("")}
          </g>
          <circle cx="50" cy="50" r="10" fill="#bc91aa"/>
        </svg>`;

      b.setAttribute(
        "aria-label",
        `${index+1}번 전선 ${labels.join(", ")}. 누르면 회전`
      );

      b.onclick = ()=>{
        if(locked || testing) return;
        masks[index] = rotateMask(masks[index]);
        sfx(370,.03,.01);
        draw();
        wave(false);
      };

      $("circuit").append(b);
    });
  }
  function light(index){
    const b = $(`pipe-${index}`);
    if(!b) return;

    b.classList.add("lit");
    b.querySelector("g").setAttribute("stroke","#e2a72a");
    b.querySelector("circle").setAttribute("fill","#facc15");
  }
  function wave(sound){
    const token = ++waveToken;
    const cells = Array.from(connected(masks));

    cells.forEach((index,n)=>{
      later(()=>{
        if(token!==waveToken) return;
        light(index);
        if(sound) bell(60+n*2,.2,.03,"game");
      },n*115);
    });

    status(`빛이 닿는 칸 ${cells.length}/9`);
    return cells.length*115;
  }

  $("reset-puzzle").hidden = false;
  $("reset-puzzle").onclick = ()=>{
    if(locked || testing) return;
    masks = make();
    draw();
    wave(false);
  };

  cleanups.push(()=>waveToken++);
  draw();
  wave(false);
}

/* ========================================================
   코드로 합성하는 배경음악
   멜로디 / 화음 / 베이스 / 아르페지오 / 벨 / 셰이커
======================================================== */
let audio = null;
let master = null;
let reverb = null;
let noiseBuffer = null;
let musicOn = false;
let soundOn = false;
let musicTimer = null;
let nextBeatTime = 0;
let beatIndex = 0;

const voices = new Set();
const frequency = midi=>440*Math.pow(2,(midi-69)/12);
const BPM = 112;
const EIGHTH = 60/BPM/2;

function unlockAudio(){
  try{
    const Constructor = window.AudioContext || window.webkitAudioContext;
    if(!Constructor) return false;

    if(!audio){
      audio = new Constructor();

      master = audio.createGain();
      master.gain.value = .7;

      const compressor = audio.createDynamicsCompressor();
      compressor.threshold.value = -18;
      compressor.knee.value = 18;
      compressor.ratio.value = 3;
      compressor.attack.value = .006;
      compressor.release.value = .2;

      master.connect(compressor);
      compressor.connect(audio.destination);

      reverb = audio.createConvolver();
      const length = Math.floor(audio.sampleRate*.8);
      const impulse = audio.createBuffer(2,length,audio.sampleRate);

      for(let c=0;c<2;c++){
        const data = impulse.getChannelData(c);
        for(let i=0;i<length;i++){
          data[i] = (Math.random()*2-1)*Math.pow(1-i/length,3)*.18;
        }
      }

      reverb.buffer = impulse;

      const wet = audio.createGain();
      wet.gain.value = .12;
      reverb.connect(wet);
      wet.connect(master);

      noiseBuffer = audio.createBuffer(
        1,Math.floor(audio.sampleRate*.12),audio.sampleRate
      );

      const noiseData = noiseBuffer.getChannelData(0);
      for(let i=0;i<noiseData.length;i++){
        noiseData[i] = Math.random()*2-1;
      }
    }

    if(audio.state==="suspended"){
      audio.resume().catch(()=>{});
    }
    return true;
  }catch(e){
    return false;
  }
}
function makeVoice(
  midi,duration,volume,type,when,group,bright=false
){
  if(!audio || !master) return;

  const start = Math.max(when,audio.currentTime);
  const oscillator = audio.createOscillator();
  const gain = audio.createGain();
  const filter = audio.createBiquadFilter();

  oscillator.type = type;
  oscillator.frequency.value = frequency(midi);

  filter.type = "lowpass";
  filter.frequency.value = bright ? 6000 : 2200;

  gain.gain.setValueAtTime(.0001,start);
  gain.gain.exponentialRampToValueAtTime(
    Math.max(.001,volume),start+.012
  );
  gain.gain.exponentialRampToValueAtTime(
    .0001,start+Math.max(.04,duration)
  );

  oscillator.connect(filter);
  filter.connect(gain);
  gain.connect(master);
  if(bright) gain.connect(reverb);

  const voice = {node:oscillator,group};
  voices.add(voice);

  oscillator.onended = ()=>{
    oscillator.disconnect();
    filter.disconnect();
    gain.disconnect();
    voices.delete(voice);
  };

  oscillator.start(start);
  oscillator.stop(start+duration+.03);
}
function synth(
  midi,duration=.3,volume=.04,type="triangle",delay=0,group="game"
){
  if(!unlockAudio()) return;
  makeVoice(
    midi,duration,volume,type,audio.currentTime+delay,group
  );
}
function bell(
  midi,duration=.6,volume=.05,group="game",when=null
){
  if(!unlockAudio()) return;

  const t = when??audio.currentTime;

  makeVoice(midi,duration,volume,"sine",t,group,true);
  makeVoice(midi+12,duration*.45,volume*.23,"sine",t+.004,group,true);
  makeVoice(midi+19,duration*.25,volume*.06,"sine",t+.007,group,true);
}
function shaker(when,volume=.004){
  if(!audio) return;

  const source = audio.createBufferSource();
  source.buffer = noiseBuffer;

  const filter = audio.createBiquadFilter();
  filter.type = "highpass";
  filter.frequency.value = 6500;

  const gain = audio.createGain();
  gain.gain.setValueAtTime(volume,when);
  gain.gain.exponentialRampToValueAtTime(.0001,when+.055);

  source.connect(filter);
  filter.connect(gain);
  gain.connect(master);

  const voice = {node:source,group:"bgm"};
  voices.add(voice);

  source.onended = ()=>{
    source.disconnect();
    filter.disconnect();
    gain.disconnect();
    voices.delete(voice);
  };

  source.start(when);
  source.stop(when+.08);
}
function sfx(hz,duration=.06,volume=.02){
  if(!soundOn || !unlockAudio()) return;

  const midi = 69+12*Math.log2(hz/440);
  makeVoice(midi,duration,volume,"sine",audio.currentTime,"game");
}
function successSound(){
  if(!soundOn || !unlockAudio()) return;
  [72,76,79,84].forEach((n,i)=>{
    bell(n,.5,.04,"game",audio.currentTime+i*.09);
  });
}
function stopVoices(group){
  voices.forEach(v=>{
    if(v.group===group){
      try{v.node.stop()}catch(e){}
    }
  });
}

const melodyA = [
  76,76,76,null,76,76,76,null,
  76,79,72,74,76,null,null,null,
  77,77,77,77,77,76,76,76,
  76,74,74,76,74,null,79,null
];
const melodyB = [
  76,76,76,null,76,76,76,null,
  76,79,72,74,76,null,null,null,
  77,77,77,77,77,76,76,76,
  79,79,77,74,72,null,null,null
];
const chords = [
  [60,64,67],[60,64,67],[65,69,72],[55,59,62],
  [60,64,67],[57,60,64],[65,69,72],[55,59,62]
];

function scheduleBeat(index,time){
  /* 소리 문제에서는 배경음악을 잠시 멈춥니다. */
  if(state.phase==="puzzle" && state.stage===4) return;

  const cycle = Math.floor(index/32);
  const step = index%32;
  const bar = Math.floor(index/8);
  const chord = chords[(cycle%2)*4+bar];
  const melody = cycle%2===0 ? melodyA : melodyB;
  const volumeScale = state.phase==="epilogue" ? .75 : 1;
  const n = melody[step];

  /* 부드러운 벨 멜로디 */
  if(n!==null){
    bell(n,.4,.033*volumeScale,"bgm",time);
    makeVoice(n-12,.19,.007*volumeScale,"triangle",time,"bgm");
  }

  /* 베이스 */
  if(step%8===0 || step%8===4){
    const bass = step%8===0 ? chord[0]-24 : chord[2]-24;
    makeVoice(bass,.35,.026*volumeScale,"triangle",time,"bgm");
  }

  /* 가벼운 화음 */
  if(step%4===2){
    chord.forEach((value,i)=>{
      makeVoice(value,.16,.011*volumeScale,"sine",time+i*.008,"bgm");
    });
  }

  /* 두 번째 진행에는 아르페지오 추가 */
  if(cycle%2===1 && step%2===1){
    makeVoice(
      chord[(step+bar)%3]+12,
      .2,.011*volumeScale,"sine",time,"bgm",true
    );
  }

  /* 작은 리듬과 종소리 */
  shaker(time,step%2===0?.004:.002);
  if(step%8===7){
    bell(chord[2]+24,.2,.007*volumeScale,"bgm",time);
  }

  /* 마지막 장면의 추가 반짝임 */
  if((state.stage===6 || state.phase==="outro") && step%8===0){
    bell(chord[0]+24,.65,.012,"bgm",time);
  }
}
function musicTick(){
  if(!audio || audio.state!=="running") return;

  if(nextBeatTime<audio.currentTime-.2){
    nextBeatTime = audio.currentTime+.04;
  }

  while(nextBeatTime<audio.currentTime+.15){
    scheduleBeat(beatIndex++,nextBeatTime);
    nextBeatTime += EIGHTH;
  }
}
function updateMusic(){
  clearInterval(musicTimer);
  musicTimer = null;
  stopVoices("bgm");

  $("music-toggle").textContent = musicOn ? "♫ 음악 ON" : "♫ 음악 OFF";
  $("music-toggle").setAttribute("aria-pressed",String(musicOn));

  if(musicOn && !document.hidden && unlockAudio()){
    nextBeatTime = audio.currentTime+.05;
    musicTimer = setInterval(musicTick,30);
    musicTick();
  }
}
$("music-toggle").onclick = ()=>{
  if(!unlockAudio()){
    openModal(
      "음악 안내",
      "이 실행 환경에서는 오디오를 사용할 수 없어요.",
      ()=>{}
    );
    return;
  }

  musicOn = !musicOn;
  updateMusic();
};
$("sound-toggle").onclick = ()=>{
  soundOn = !soundOn;
  unlockAudio();
  $("sound-toggle").textContent = soundOn ? "효과음 ON" : "효과음 OFF";
  $("sound-toggle").setAttribute("aria-pressed",String(soundOn));
};
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){
    stopVoices("game");
    stopVoices("bgm");
  }
  updateMusic();
});

/* 시작 */
resumePoint = loadSave();
setChrome(true);
renderIntro();

<script>
/*
========================================================
장면 연출 추가 패치

기준:
직전에 제공한 SAVE_KEY="seoul-star-scene-v6" 버전.

유지:
- 일곱 문제
- 합성 배경음악
- 인트로 타이틀 좌표
- 인트로 투명 시작 버튼 좌표
- 테스트 메뉴

추가:
- 전체 이미지 위 대화창
- 대화창 밖으로 나온 캐릭터
- 준비 메모
- 미션 사이 이동 전환
- 기억 조각 수집 노트

새 이미지 없이 작동합니다.
========================================================
*/

(()=>{
  const baseNavigate = navigate;
  const baseRenderPuzzle = renderPuzzle;

  const NOTE_SAVE_KEY = SAVE_KEY+"-memories";
  const memoryNames = [
    "상자에서 찾은 별",
    "잠에서 깨어난 별",
    "창밖의 서울",
    "침대맡의 자리",
    "매일 들려오던 노래",
    "소망나무의 이야기",
    "별의 새로운 자리"
  ];
  const memoryTexts = [
    "장식 상자 속에 끈이 끊어진 별 하나가 들어 있었다.",
    "새 끈을 달아 트리에 걸었더니 별이 깨어났다.",
    "별은 물 위로 길게 비치던 서울의 불빛을 기억했다.",
    "크리스마스가 지나도 별을 침대맡에 두던 아이가 있었다.",
    "아이는 잠들기 전에 노래와 하루 이야기를 들려주었다.",
    "소망나무에는 별이 오래전 듣던 이야기와 닮은 소원이 가득했다.",
    "읽고 싶은 이야기가 많아진 별은 조금 더 높은 곳으로 떠올랐다."
  ];
  const transitionLines = [
    "장식 상자를 찾아서!",
    "이번엔 트리를 꾸며볼까?",
    "서울을 한눈에!",
    "책 사이를 뒤적뒤적",
    "기억 속 멜로디를 찾아서",
    "소원이 주렁주렁!",
    "다시 트리로 출발!"
  ];

  let earned = new Set();
  let preparing = false;
  let moving = false;
  let notebook = null;
  let notebookFocus = null;

  try{
    const data = JSON.parse(localStorage.getItem(NOTE_SAVE_KEY));
    if(Array.isArray(data)){
      earned = new Set(data.filter(n=>Number.isInteger(n)&&n>=0&&n<7));
    }
  }catch(e){}

  /*
  기존 진행 저장과 기억 노트 저장이 다를 경우,
  이전에 완료한 미션까지만 복원합니다.
  */
  if(resumePoint){
    for(let i=0;i<resumePoint.stage;i++) earned.add(i);

    if(["after","epilogue","outro"].includes(resumePoint.phase)){
      earned.add(resumePoint.stage);
    }
  }

  function saveMemories(){
    try{
      localStorage.setItem(NOTE_SAVE_KEY,JSON.stringify([...earned]));
    }catch(e){}
  }

  function resetMemories(){
    earned.clear();
    saveMemories();
    updateNotebookButton();
  }

  function updateNotebookButton(){
    const button=document.getElementById("memory-note-button");
    if(button){
      button.textContent=`▤ ${earned.size}/7`;
      button.setAttribute("aria-label",`기억 노트 열기. 기억 ${earned.size}개`);
    }
  }

  /* 상단에 작은 기억 노트 버튼 추가 */
  const noteButton=document.createElement("button");
  noteButton.id="memory-note-button";
  noteButton.className="tool";
  noteButton.onclick=openNotebook;
  document.querySelector(".tools").insertBefore(noteButton,$("home"));
  updateNotebookButton();

  function background(file,label,stage){
    const type=WORLDS[stage]||"tree";
    const emoji=["📦","⭐","🌆","📚","🎵","🌳","🌟"][stage]||"⭐";

    return `
      <div class="vn-background">
        <div class="world ${type}">
          ${decorativeWorld(type)}
        </div>
        <div class="vn-fallback">
          <span class="vn-large">${emoji}</span>
          <small>${esc(label)}</small>
        </div>
        <img src="${esc(file)}"
             alt="${esc(label)}"
             onerror="this.hidden=true">
      </div>`;
  }

  function dialogueMarkup(){
    return `
      <div class="vn-dialog" id="vn-dialog">
        <div class="vn-portrait">
          <span id="vn-avatar-fallback"></span>
          <img id="vn-avatar" alt="" onerror="this.hidden=true">
        </div>
        <div class="vn-copy">
          <div class="vn-name" id="vn-name"></div>
          <div class="vn-text" id="vn-text"></div>
          <button class="vn-next" id="vn-next" hidden>다음</button>
        </div>
      </div>`;
  }

  /* 전체 배경 위에 대화창을 띄우도록 교체 */
  renderDialogue=function(lines,done,title,image){
    let index=0;

    $("screen").innerHTML=`
      <section class="vn-page">
        ${background(image,title,state.stage)}
        <h1 class="vn-chapter">${esc(title)}</h1>
        ${dialogueMarkup()}
      </section>`;

    function show(){
      const line=lines[index];
      const character=CHAR[line.name];
      const narration=line.kind==="note";

      $("vn-dialog").classList.toggle("is-narration",narration);
      $("vn-name").textContent=narration?"이야기":line.name;

      $("vn-avatar").hidden=true;
      $("vn-avatar-fallback").textContent=character?.emoji||"";

      if(character){
        $("vn-avatar").src=character.file;
        $("vn-avatar").alt=line.name;
        $("vn-avatar").hidden=false;
      }

      $("vn-next").textContent=
        index===lines.length-1
          ? state.phase==="before"
            ? "어디로 갈까?"
            : "계속하기"
          : "다음";

      typeText(
        $("vn-text"),
        narration?`(${line.text})`:line.text,
        $("vn-next")
      );
    }

    $("vn-text").onclick=()=>finishTyping?.();

    $("vn-next").onclick=()=>{
      if(finishTyping){
        finishTyping();
        return;
      }

      if(index<lines.length-1){
        index++;
        show();
      }else{
        done();
      }
    };

    show();
  };

  /* 장소 안내도 사진 위 대화창으로 교체 */
  renderGuide=function(){
    const route=ROUTES[state.stage];

    $("screen").innerHTML=`
      <section class="vn-page">
        ${background(
          `route_0${state.stage+1}.png`,
          route.place,
          state.stage
        )}
        <h1 class="vn-chapter">${esc(route.place)}</h1>

        <div class="vn-route-note">
          <strong>이쪽으로 가볼까?</strong><br>
          ${esc(route.info)}
        </div>

        ${dialogueMarkup()}
      </section>`;

    $("vn-name").textContent="해치";
    $("vn-avatar-fallback").textContent=CHAR["해치"].emoji;
    $("vn-avatar").src=CHAR["해치"].file;
    $("vn-avatar").alt="해치";

    $("vn-next").textContent="도착했어! 시작";
    $("vn-next").onclick=()=>navigate("puzzle");
    $("vn-text").onclick=()=>finishTyping?.();

    typeText(
      $("vn-text"),
      route.line,
      $("vn-next")
    );
  };

  /* 퍼즐은 기존 조작과 판정을 유지 */
  renderPuzzle=function(){
    baseRenderPuzzle();

    const ribbon=$("screen").querySelector(".ribbon");
    if(ribbon){
      ribbon.style.fontFamily='"Gaegu",sans-serif';
    }
  };

  /* 도입부 메모 */
  function showPreparation(done){
    cleanScreen();
    setChrome(false);
    $("pass").disabled=true;
    preparing=true;

    $("screen").innerHTML=`
      <section class="vn-memo-screen">
        <span class="vn-memo-doodle"
              style="left:4%;top:7%;transform:rotate(-17deg)">☆</span>
        <span class="vn-memo-doodle"
              style="right:4%;bottom:8%;color:#a7c9ba">♫</span>

        <div class="vn-memo">
          <h1>해치의 크리스마스 준비!</h1>
          <ul>
            <li>□ 장식 상자 찾기</li>
            <li>□ 트리 예쁘게 꾸미기</li>
            <li>□ 다 같이 간식 먹기!</li>
          </ul>

          <p class="scribble">
            별 장식은 어디 뒀더라……?<br>
            분명 여기 있었는데!
          </p>

          <button class="primary" id="vn-memo-start">
            상자부터 찾으러 가자!
          </button>
        </div>
      </section>`;

    $("vn-memo-start").onclick=()=>{
      if(!preparing) return;
      preparing=false;
      done();
    };

    cleanups.push(()=>{preparing=false});
  }

  /* 챕터 사이 짧은 이동 전환 */
  function showTransition(stage,done,epilogue=false){
    cleanScreen();
    moving=true;
    $("pass").disabled=true;

    const character=CHAR["해치"];
    const title=epilogue
      ? "별은 어디까지 올라갈까?"
      : transitionLines[stage];

    $("screen").innerHTML=`
      <section class="vn-transition">
        <div class="vn-transition-label">
          ${epilogue?"작은 이야기의 끝":"다음 이야기"}
        </div>

        <h1>${esc(title)}</h1>

        <div class="vn-travel-row">
          <div class="vn-travel-avatar">
            <span>${character.emoji}</span>
            <img src="${character.file}" alt="이동하는 해치"
                 onerror="this.hidden=true">
          </div>
          <div class="vn-travel-star">⭐</div>
        </div>

        <button class="vn-transition-skip" id="vn-transition-skip">
          건너뛰기 ›
        </button>
      </section>`;

    let completed=false;

    function finish(){
      if(completed) return;
      completed=true;
      moving=false;
      done();
    }

    $("vn-transition-skip").onclick=finish;

    later(finish,reduced()?350:1900);

    cleanups.push(()=>{
      completed=true;
      moving=false;
    });
  }

  /* 기억 획득 표시 */
  function memoryToast(index){
    const toast=document.createElement("button");
    toast.className="vn-toast";
    toast.textContent=`✦ 기억 노트에 「${memoryNames[index]}」 추가!`;
    toast.onclick=openNotebook;
    $("screen").append(toast);

    later(()=>{
      if(toast.isConnected) toast.remove();
    },2300);
  }

  /* 화면 이동에 메모·전환·기억 수집 연결 */
  navigate=function(phase,stage=state.stage){
    if(preparing||moving) return;

    const from={...state};

    if(phase==="intro"){
      resetMemories();
      baseNavigate(phase,stage);
      return;
    }

    if(
      phase==="before" &&
      stage===0 &&
      from.phase==="intro"
    ){
      resetMemories();

      showPreparation(()=>{
        baseNavigate("before",0);
      });
      return;
    }

    if(
      from.phase==="after" &&
      (
        (phase==="before" && stage>from.stage) ||
        phase==="epilogue"
      )
    ){
      showTransition(
        stage,
        ()=>baseNavigate(phase,stage),
        phase==="epilogue"
      );
      return;
    }

    const newMemory=phase==="after"&&!earned.has(stage);

    if(phase==="after"){
      earned.add(stage);
      saveMemories();
      updateNotebookButton();
    }

    baseNavigate(phase,stage);

    if(newMemory){
      memoryToast(stage);
    }
  };

  /* 기억 노트: 기존 모달과 별도로 열고 닫기 */
  function openNotebook(){
    if(notebook || !$("modal").hidden || preparing || moving) return;

    notebookFocus=document.activeElement;
    notebook=document.createElement("section");
    notebook.className="vn-notebook";
    notebook.setAttribute("role","dialog");
    notebook.setAttribute("aria-modal","true");
    notebook.setAttribute("aria-labelledby","vn-notebook-title");

    notebook.innerHTML=`
      <div class="vn-notebook-paper">
        <h1 id="vn-notebook-title">별의 기억 노트</h1>
        <p>함께 찾은 이야기가 한 장씩 모이고 있어요. ${earned.size}/7</p>

        ${memoryNames.map((name,index)=>{
          const unlocked=earned.has(index);

          return `
            <article class="vn-memory-item ${unlocked?"":"is-locked"}">
              <strong>
                ${unlocked?"✦":"○"} ${unlocked?esc(name):"아직 찾지 못한 기억"}
              </strong>
              <p>
                ${unlocked
                  ? esc(memoryTexts[index])
                  : `${index+1}번째 미션에서 만나볼 수 있어요.`}
              </p>
            </article>`;
        }).join("")}

        <button class="primary" id="vn-notebook-close" style="width:100%">
          탐험으로 돌아가기
        </button>
      </div>`;

    $("app").append(notebook);
    $("screen").inert=true;
    $("topbar").inert=true;
    $("debug").inert=true;

    $("vn-notebook-close").onclick=closeNotebook;

    notebook.onclick=e=>{
      if(e.target===notebook) closeNotebook();
    };

    $("vn-notebook-close").focus();
  }

  function closeNotebook(){
    if(!notebook) return;

    notebook.remove();
    notebook=null;

    $("screen").inert=false;
    $("topbar").inert=false;
    $("debug").inert=false;

    if(notebookFocus?.isConnected) notebookFocus.focus();
  }

  document.addEventListener("keydown",e=>{
    if(!notebook) return;

    if(e.key==="Escape"){
      e.preventDefault();
      closeNotebook();
    }
    if(e.key==="Tab"){
      e.preventDefault();
      $("vn-notebook-close").focus();
    }
  });

})();
</script>

이전 전체 HTML + 바로 전에 제공한 대화창/메모지 패치.

    }catch(e){}

    document.getElementById("app").dataset.difficulty=value;
  }

  setDifficulty(difficulty);

  /*
  다른 코드에서도 현재 선택값을 읽을 수 있습니다.
  예: getGameDifficulty()==="adult"
  */
